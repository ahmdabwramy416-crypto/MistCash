<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي - MistCash</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', Tahoma, sans-serif; }
        body { background-color: #0d0519; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
        .card { background: #1a0b2e; border: 1px solid #3b1568; border-radius: 16px; padding: 30px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .avatar { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #eab308; margin-bottom: 15px; object-fit: cover; }
        h2 { color: #eab308; margin-bottom: 5px; }
        p { color: #aaa; font-size: 0.9rem; margin-bottom: 20px; }
        .badge { background: #2a1147; padding: 12px; border-radius: 10px; margin-bottom: 20px; color: #4ade80; font-weight: bold; border: 1px solid #4c1d95; }
        .btn { display: block; width: 100%; padding: 12px; background: #7c3aed; color: white; border: none; border-radius: 8px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #6d28d9; }
    </style>
</head>
<body>
    <div class="card">
        <img id="avatar" src="https://via.placeholder.com/90" alt="صورة المستخدم" class="avatar">
        <h2 id="name">جاري التحميل...</h2>
        <p id="email">...</p>
        <div class="badge">رصيدك الحالي: <span id="points">0</span> نقطة</div>
        <a href="index.html" class="btn">العودة إلى الرئيسية</a>
    </div>

    <script>
        if (localStorage.getItem("is_logged_in") !== "true") {
            window.location.href = "login.html";
        } else {
            document.getElementById("name").innerText = localStorage.getItem("user_name");
            document.getElementById("email").innerText = localStorage.getItem("user_email");
            document.getElementById("points").innerText = localStorage.getItem("user_points") || "0";
            const pic = localStorage.getItem("user_picture");
            if (pic) document.getElementById("avatar").src = pic;
        }
    </script>
</body>
</html>
