<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي - MistCash</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', Tahoma, sans-serif; }
        body { background-color: #0d0519; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
        .profile-card { background: #1a0b2e; border: 1px solid #3b1568; border-radius: 16px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
        .avatar { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #c084fc; margin-bottom: 15px; object-fit: cover; }
        h2 { color: #c084fc; margin-bottom: 8px; font-size: 1.4rem; }
        p { color: #aaa; font-size: 0.9rem; margin-bottom: 20px; }
        .points-box { background: #2a1147; padding: 12px; border-radius: 10px; margin-bottom: 20px; font-size: 1.1rem; color: #4ade80; font-weight: bold; border: 1px solid #4c1d95; }
        .btn { display: block; width: 100%; padding: 12px; background: #7c3aed; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; text-decoration: none; margin-top: 10px; transition: 0.3s; text-align: center; }
        .btn:hover { background: #6d28d9; }
        .logout-btn { background: #ef4444; }
        .logout-btn:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="profile-card">
        <img id="userAvatar" src="https://via.placeholder.com/90" alt="صورة المستخدم" class="avatar">
        
        <h2 id="userName">جاري التحميل...</h2>
        <p id="userEmail">...</p>

        <div class="points-box">
            رصيدك: <span id="userPoints">0</span> نقطة
        </div>

        <a href="index.html" class="btn">الرئيسية وعروض الربح</a>
        <button onclick="logout()" class="btn logout-btn">تسجيل الخروج</button>
    </div>

    <script>
        // التحقق الآمن من الجلسة
        const isLoggedIn = localStorage.getItem("is_logged_in");
        
        if (isLoggedIn !== "true") {
            // التحويل لصفحة الدخول فقط إذا لم يكن مسجلاً
            window.location.href = "login.html";
        } else {
            // جلب وعرض البيانات المخزنة بسلاسة
            document.getElementById("userName").innerText = localStorage.getItem("user_name") || "مستخدم MistCash";
            document.getElementById("userEmail").innerText = localStorage.getItem("user_email") || "";
            
            const userPicture = localStorage.getItem("user_picture");
            if (userPicture && userPicture !== "") {
                document.getElementById("userAvatar").src = userPicture;
            }

            document.getElementById("userPoints").innerText = localStorage.getItem("user_points") || "0";
        }

        // دالة تسجيل الخروج المنضبطة
        function logout() {
            localStorage.removeItem("is_logged_in");
            localStorage.removeItem("user_name");
            localStorage.removeItem("user_email");
            localStorage.removeItem("user_picture");
            window.location.href = "login.html";
        }
    </script>

</body>
</html>
