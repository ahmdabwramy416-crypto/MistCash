<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MistCash | حسابي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo"><i class="fa-solid fa-gamepad"></i> MistCash</a>
        <nav class="desktop-nav">
            <a href="index.html"><i class="fa-solid fa-coins"></i> كسب النقاط</a>
            <a href="rewards.html"><i class="fa-solid fa-gift"></i> الجوائز</a>
            <a href="referral.html"><i class="fa-solid fa-users"></i> الاحالة</a>
            <a href="profile.html" class="active"><i class="fa-solid fa-user"></i> الحساب</a>
        </nav>
        <div class="user-stats">
            <div class="stat-badge"><i class="fa-solid fa-coins"></i> <span>1,250</span></div>
        </div>
    </header>

    <main>
        <div class="profile-card">
            <div class="profile-header">
                <div class="avatar"><i class="fa-solid fa-user"></i></div>
                <div>
                    <h3>أحمد محمد</h3>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">ahmed@example.com</p>
                </div>
            </div>
            <h4><i class="fa-solid fa-clock-rotate-left"></i> سجل العمليات الأخير</h4>
            <ul class="history-list">
                <li class="history-item">
                    <span>إكمال استطلاع BitLabs</span>
                    <span style="color: var(--accent-green); font-weight: bold;">+250 نقطة</span>
                </li>
                <li class="history-item">
                    <span>مكافأة التسجيل</span>
                    <span style="color: var(--accent-green); font-weight: bold;">+1,000 نقطة</span>
                </li>
            </ul>
        </div>
    </main>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>الرئيسية</span>
        </a>
        <a href="rewards.html" class="nav-item">
            <i class="fa-solid fa-gift"></i>
            <span>الجوائز</span>
        </a>
        <a href="purchases.html" class="nav-item">
            <i class="fa-solid fa-bag-shopping"></i>
            <span>مشترياتي</span>
        </a>
        <a href="referral.html" class="nav-item">
            <i class="fa-solid fa-users"></i>
            <span>الإحالة</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>حسابي</span>
        </a>
    </nav>
</body>
</html>
