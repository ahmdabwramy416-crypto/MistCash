<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي - MistCash</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- محتوى الصفحة الرئيسي -->
  <main class="container" style="padding: 20px; max-width: 500px; margin: 0 auto; text-align: center;">
    
    <h2>حسابي</h2>

    <!-- قسم تسجيل الدخول وإنشاء الحساب -->
    <div class="auth-card" style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 20px; margin-top: 20px; backdrop-filter: blur(10px);">
      
      <div id="auth-forms">
        <!-- نموذج تسجيل الدخول -->
        <form id="login-form" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px;">
          <h3 style="margin-bottom: 10px;">تسجيل الدخول</h3>
          <input type="email" id="login-email" placeholder="البريد الإلكتروني" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: #fff; box-sizing: border-box;">
          <input type="password" id="login-password" placeholder="كلمة المرور" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: #fff; box-sizing: border-box;">
          <button type="submit" style="width: 100%; padding: 12px; border-radius: 8px; border: none; background: #3b82f6; color: #fff; font-weight: bold; cursor: pointer;">دخول</button>
        </form>

        <hr style="border: 0; border-top: 1px solid rgba(255, 255, 255, 0.1); margin: 20px 0;">

        <!-- نموذج إنشاء حساب -->
        <form id="signup-form" style="display: flex; flex-direction: column; gap: 12px;">
          <h3 style="margin-bottom: 10px;">إنشاء حساب جديد</h3>
          <input type="email" id="signup-email" placeholder="البريد الإلكتروني" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: #fff; box-sizing: border-box;">
          <input type="password" id="signup-password" placeholder="كلمة المرور" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: #fff; box-sizing: border-box;">
          <button type="submit" style="width: 100%; padding: 12px; border-radius: 8px; border: none; background: #10b981; color: #fff; font-weight: bold; cursor: pointer;">إنشاء حساب جديد</button>
        </form>
      </div>

      <!-- معلومات المستخدم المسجل -->
      <div id="user-info" style="display: none;">
        <i class="fa-solid fa-circle-user" style="font-size: 60px; color: #3b82f6; margin-bottom: 15px;"></i>
        <h3>مرحباً بك!</h3>
        <p style="font-size: 18px; margin: 15px 0;">رصيد النقاط: <strong id="user-points" style="color: #f59e0b;">0</strong> نقطة</p>
        <button id="logout-btn" style="padding: 10px 20px; border-radius: 8px; border: none; background: #ef4444; color: #fff; font-weight: bold; cursor: pointer; margin-top: 10px;">تسجيل الخروج</button>
      </div>

    </div>

  </main>

  <!-- شريط التنقل السفلية -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
    <a href="rewards.html" class="nav-item"><i class="fa-solid fa-gift"></i><span>المكافآت</span></a>
    <a href="purchases.html" class="nav-item"><i class="fa-solid fa-bag-shopping"></i><span>المشتريات</span></a>
    <a href="referral.html" class="nav-item"><i class="fa-solid fa-users"></i><span>الإحالة</span></a>
    <a href="profile.html" class="nav-item active"><i class="fa-solid fa-user"></i><span>حسابي</span></a>
  </nav>

  <!-- ربط ملف Firebase البرمجي -->
  <script type="module" src="app.js"></script>
</body>
</html>
