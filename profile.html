<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loot Play - ملفي الشخصي</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="top-header">
    <div style="font-weight: bold; color: var(--accent-yellow);">LOOT PLAY</div>
    <div class="coin-badge">
      <i class="fa-solid fa-coins"></i>
      <span id="user-points">0</span>
    </div>
  </header>

  <main style="padding: 20px; max-width: 500px; margin: 0 auto; text-align: center;">
    <h2 style="color: var(--accent-yellow); margin-bottom: 20px;">حسابي</h2>

    <div style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 25px;">
      <i class="fa-solid fa-user-astronaut" style="font-size: 60px; color: var(--accent-yellow); margin-bottom: 15px;"></i>
      <h3 id="user-email-text" style="color: #fff; font-size: 16px; margin-bottom: 10px;">جاري التحميل...</h3>
      <p style="font-size: 18px; margin: 15px 0;">رصيد النقاط: <strong id="profile-points" style="color: var(--accent-yellow);">0</strong> نقطة</p>
      <button id="logout-btn" style="padding: 12px 30px; border-radius: 8px; border: none; background: #ef4444; color: #fff; font-weight: bold; cursor: pointer; width: 100%;">تسجيل الخروج</button>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
    <a href="wheel.html" class="nav-link"><i class="fa-solid fa-dharmachakra"></i><span>العجلة</span></a>
    <a href="rewards.html" class="nav-link"><i class="fa-solid fa-gift"></i><span>المكافآت</span></a>
    <a href="referral.html" class="nav-link"><i class="fa-solid fa-users"></i><span>الإحالة</span></a>
    <a href="profile.html" class="nav-link active"><i class="fa-solid fa-user"></i><span>حسابي</span></a>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
