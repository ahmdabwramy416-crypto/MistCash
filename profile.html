<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي - MistCash</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 80vh; }
        .avatar { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #eab308; margin-bottom: 15px; object-fit: cover; }
        
        /* تنسيق مخصص لشريط التنقل ليتسع لـ 6 أزرار بانتظام */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #1a1700; border-top: 2px solid #eab308; display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; box-shadow: 0 -4px 20px rgba(234, 179, 8, 0.15); }
        .nav-item { color: #cbd5e1; text-decoration: none; font-size: 0.65rem; text-align: center; display: flex; flex-direction: column; align-items: center; transition: 0.3s; flex: 1; }
        .nav-item.active, .nav-item:hover { color: #eab308; transform: translateY(-2px); }
        .nav-icon { font-size: 1.1rem; margin-bottom: 2px; }
    </style>
</head>
<body>
    <div class="container" style="width: 100%;">
        <div class="card" style="text-align: center;">
            <img id="avatar" src="https://via.placeholder.com/90" alt="صورة المستخدم" class="avatar">
            <h2 id="name" style="margin-bottom: 5px;">جاري التحميل...</h2>
            <p id="email" style="color: #cbd5e1; font-size: 0.9rem; margin-bottom: 20px;">...</p>
            <div class="points-box" style="margin-bottom: 20px; display: inline-block;">رصيدك الحالي: <span id="points">0</span> نقطة</div>
            <br>
            <button onclick="logout()" class="btn-yellow" style="background: #dc2626; color: #fff; box-shadow: none;">تسجيل الخروج</button>
        </div>
    </div>

    <!-- شريط التنقل السفلي المحدث (6 أزرار) -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>الرئيسية</a>
        <a href="videos.html" class="nav-item"><span class="nav-icon">🎬</span>فيديوهات</a>
        <a href="rewards.html" class="nav-item"><span class="nav-icon">👥</span>الدعوات</a>
        <a href="store.html" class="nav-item"><span class="nav-icon">🔥</span>المتجر</a>
        <a href="purchases.html" class="nav-item"><span class="nav-icon">📦</span>المشتريات</a>
        <a href="profile.html" class="nav-item active"><span class="nav-icon">👤</span>حسابي</a>
    </div>

    <script>
        if (localStorage.getItem("is_logged_in") !== "true") { window.location.href = "login.html"; }
        
        const userEmail = localStorage.getItem("user_email");
        const pointsKey = "points_" + userEmail;

        document.getElementById("name").innerText = localStorage.getItem("user_name");
        document.getElementById("email").innerText = userEmail;
        document.getElementById("points").innerText = localStorage.getItem(pointsKey) || "0";
        
        const pic = localStorage.getItem("user_picture");
        if (pic) document.getElementById("avatar").src = pic;

        function logout() {
            // نقوم فقط بإلغاء حالة تسجيل الدخول الحالية دون مسح مفاتيح النقاط الخاصة بالإيميل
            localStorage.removeItem("is_logged_in");
            localStorage.removeItem("user_name");
            localStorage.removeItem("user_email");
            localStorage.removeItem("user_picture");
            
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
