<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية - MistCash</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; flex-direction: column; justify-content: flex-start; align-items: center; min-height: 90vh; padding: 15px; margin-bottom: 70px; }
        .container { width: 100%; max-width: 450px; text-align: center; }
        .card { background: #1a1700; border: 2px solid #eab308; border-radius: 16px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(234, 179, 8, 0.2); }
        h2 { color: #eab308; margin-bottom: 10px; font-size: 1.6rem; }
        p { color: #cbd5e1; font-size: 0.95rem; line-height: 1.5; }
        .btn-yellow { background: #eab308; color: #000; font-weight: bold; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; width: 100%; font-size: 1rem; margin-top: 15px; transition: 0.3s; }
        .btn-yellow:hover { background: #ca9a04; }
        .offers-section { display: grid; grid-template-columns: 1fr; gap: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>مرحباً بك في MistCash</h2>
        <p style="margin-bottom: 20px;">رصيد حسابك الحالي: <span id="userPoints" style="color: #eab308; font-weight: bold; font-size: 1.2rem;">0</span> نقطة</p>
        
        <!-- قسم عجلة الحظ اليومية -->
        <div class="card">
            <h3>عجلة الحظ اليومية</h3>
            <p>اضغط لدوران العجلة واربح نقاطاً مجانية كل 24 ساعة!</p>
            <button onclick="spinWheel()" class="btn-yellow">دوران العجلة (اربح نقاط)</button>
        </div>

        <!-- قسم العروض وشركة CPALead -->
        <div class="card">
            <h3>حائط العروض (CPALead)</h3>
            <p>أكمل المهام والعروض واجمع آلاف النقاط يومياً!</p>
            <button onclick="openCPALeadOffers()" class="btn-yellow" style="background: #2563eb; color: #fff;">عرض عروض CPALead</button>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item active"><span class="nav-icon">🏠</span>الرئيسية</a>
        <a href="referral.html" class="nav-item"><span class="nav-icon">👥</span>الدعوات</a>
        <a href="store.html" class="nav-item"><span class="nav-icon">🎁</span>المتجر</a>
        <a href="purchases.html" class="nav-item"><span class="nav-icon">📦</span>المشتريات</a>
        <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span>حسابي</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyB6rnXLMDlvy0Eezc7MkdmP334EzPTKlGE",
          authDomain: "mistcash-9a71c.firebaseapp.com",
          projectId: "mistcash-9a71c",
          storageBucket: "mistcash-9a71c.firebasestorage.app",
          messagingSenderId: "819929785371",
          appId: "1:819929785371:web:396e322f83319016bb44be",
          measurementId: "G-FGBZZ1P9W6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        if (localStorage.getItem("is_logged_in") !== "true") { 
            window.location.href = "login.html"; 
        }

        const userEmail = localStorage.getItem("user_email");
        const pointsKey = "points_" + userEmail;
        
        // عرض النقاط الحالية للمستخدم
        let currentPoints = parseInt(localStorage.getItem(pointsKey) || localStorage.getItem("user_points") || "0");
        document.getElementById("userPoints").innerText = currentPoints;

        // دالة إرسال عمولة 10% لصاحب الدعوة تلقائياً في السحابة
        async function sendReferralCommission(earnedPoints) {
            const inviterRefCode = localStorage.getItem("my_inviter_ref_code");
            if (inviterRefCode && earnedPoints > 0) {
                const commission = Math.floor(earnedPoints * 0.10); // احتساب 10%
                if (commission > 0) {
                    try {
                        const bonusRef = doc(db, "referrals_bonus", inviterRefCode);
                        await setDoc(bonusRef, { bonus: increment(commission) }, { merge: true });
                    } catch (err) {
                        console.error("خطأ في إرسال العمولة:", err);
                    }
                }
            }
        }

        // تفاعل عجلة الحظ
        window.spinWheel = async function() {
            // يمكنك ربط كود العجلة القديم الخاص بك هنا، حالياً تمنح 50 نقطة تجريبية
            let wonPoints = 50; 
            currentPoints += wonPoints;

            // تحديث محلياً
            localStorage.setItem(pointsKey, currentPoints);
            localStorage.setItem("user_points", currentPoints);
            document.getElementById("userPoints").innerText = currentPoints;

            // تحديث سحابياً في Firebase
            try {
                const userRef = doc(db, "users", userEmail);
                await updateDoc(userRef, { points: currentPoints });
            } catch (err) {
                console.error("خطأ في تحديث النقاط بالسحابة:", err);
            }

            // إرسال 10% لصاحب الدعوة أوتوماتيكياً
            await sendReferralCommission(wonPoints);

            alert(`مبروك! لقد ربحت ${wonPoints} نقطة وأضيفت لرصيدك.`);
        }

        // زر فتح عروض CPALead (ضع رابط حائط العروض الخاص بك هنا)
        window.openCPALeadOffers = function() {
            // استبدل الرابط أدناه برابط العروض الخاص بك من CPALead
            window.location.href = "store.html"; 
        }
    </script>
</body>
</html>
