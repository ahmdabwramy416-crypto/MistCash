<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MistCash - الصفحة الرئيسية</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <!-- الهيدر الشفاف والأنيق -->
  <header class="header">
    <div class="logo">
      <i class="fa-solid fa-coins"></i> MistCash
    </div>
    <div class="user-status">
      <div class="points-badge">
        <i class="fa-solid fa-star"></i>
        <span id="user-points">0</span> نقطة
      </div>
      <button id="logout-btn" class="btn-logout-icon" title="تسجيل الخروج">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </header>

  <div class="main-wrapper">

    <!-- قسم الانتقال إلى عروض CPALead -->
    <section class="card cpa-banner-card">
      <div class="card-icon">
        <i class="fa-solid fa-rocket"></i>
      </div>
      <h2>عروض واختبارات CPALead</h2>
      <p>أكمل العروض والمهام السريعة لاكتساب مئات النقاط فوراً!</p>
      <a href="https://www.cpalead.com" target="_blank" class="btn-cpa-action">
        <i class="fa-solid fa-arrow-up-right-from-square"></i> الانتقال إلى CPALead
      </a>
    </section>

    <!-- قسم عجلة الحظ -->
    <section class="card wheel-card">
      <h2><i class="fa-solid fa-spinner"></i> عجلة الحظ اليومية</h2>
      <p class="sub-text">أدر العجلة واحصل على نقاط مجانية يومياً!</p>
      <div class="wheel-box">
        <canvas id="wheel-canvas" width="300" height="300"></canvas>
        <button id="spin-btn" class="btn-spin-main">أدر العجلة الآن</button>
      </div>
    </section>

    <!-- قسم جدار العروض (CPA Wall) -->
    <section class="card iframe-card">
      <h2><i class="fa-solid fa-list-check"></i> جدار المهام المباشر</h2>
      <div class="iframe-container">
        <iframe id="cpa-wall" src="" frameborder="0"></iframe>
      </div>
    </section>

    <!-- قسم نظام الإحالة ودعوة الأصدقاء -->
    <section class="card ref-card">
      <h2><i class="fa-solid fa-user-plus"></i> دعوة الأصدقاء</h2>
      <p>احصل على 100 نقطة عن كل صديق يقوم بالتسجيل عبر رابطك الخاص!</p>
      <div class="ref-input-group">
        <input type="text" id="ref-link" readonly value="جاري جلب الرابط...">
        <button id="copy-ref-btn" class="btn-copy-action">
          <i class="fa-solid fa-copy"></i> نسخ
        </button>
      </div>
    </section>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
