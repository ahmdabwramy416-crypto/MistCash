<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loot Play 2.0</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- شريط الرأس الذهبي -->
  <header class="top-header">
    <div style="font-weight: bold; color: var(--accent-yellow);">LOOT PLAY</div>
    <div class="coin-badge">
      <i class="fa-solid fa-coins"></i>
      <span id="user-points">0</span>
    </div>
  </header>

  <!-- البانر الرئيسي -->
  <div class="hero-banner">
    <h2>العب واكسب البطاقات 🪙</h2>
    <p style="color: #ccc; font-size: 13px;">جمع النقاط اليومية واستبدلها ببطاقات Google Play وعملات الألعاب!</p>
  </div>

  <!-- الأزرار السريعة -->
  <div class="actions-grid">
    <a href="wheel.html" class="action-btn">
      <i class="fa-solid fa-dharmachakra"></i>
      <span>عجلة الحظ</span>
    </a>
    <a href="rewards.html" class="action-btn">
      <i class="fa-solid fa-gift"></i>
      <span>المكافآت</span>
    </a>
    <a href="referral.html" class="action-btn">
      <i class="fa-solid fa-user-plus"></i>
      <span>دعوة</span>
    </a>
  </div>

  <!-- قسم جدار العروض -->
  <div class="section-title">
    <i class="fa-solid fa-bolt"></i>
    <h3>عروض اليوم الممتازة</h3>
  </div>

  <div class="offerwall-container">
    <iframe id="cpa-wall" src="https://www.appstorevault.mobi/wall/Fja8DpRW"></iframe>
  </div>

  <!-- شريط التنقل السفلي -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-link active"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
    <a href="wheel.html" class="nav-link"><i class="fa-solid fa-dharmachakra"></i><span>العجلة</span></a>
    <a href="rewards.html" class="nav-link"><i class="fa-solid fa-gift"></i><span>المكافآت</span></a>
    <a href="referral.html" class="nav-link"><i class="fa-solid fa-users"></i><span>الإحالة</span></a>
    <a href="profile.html" class="nav-link"><i class="fa-solid fa-user"></i><span>حسابي</span></a>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
