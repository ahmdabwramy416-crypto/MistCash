<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loot Play - MistCash</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Header / Top Bar -->
  <header class="top-bar">
    <div class="user-badge">
      <i class="fa-solid fa-user-astronaut"></i>
      <span id="user-email-display">زائر</span>
    </div>
    <div class="points-badge">
      <i class="fa-solid fa-coins coin-icon"></i>
      <span id="global-points">0</span>
    </div>
  </header>

  <main class="main-content">
    
    <!-- Banner Carousel / Welcome -->
    <div class="hero-card">
      <h2>العبي واكسب الجوائز! 🎮</h2>
      <p>أكمل المهام اليومية، أدر عجلة الحظ واجمع البطاقات المفضلة لديك.</p>
    </div>

    <!-- Quick Actions (عجلة الحظ، المهام، دعوة) -->
    <div class="quick-grid">
      <a href="wheel.html" class="action-card neon-purple">
        <i class="fa-solid fa-circle-notch fa-spin-hover"></i>
        <span>عجلة الحظ</span>
      </a>
      <a href="rewards.html" class="action-card neon-green">
        <i class="fa-solid fa-gift"></i>
        <span>المكافآت</span>
      </a>
      <a href="referral.html" class="action-card neon-blue">
        <i class="fa-solid fa-user-plus"></i>
        <span>دعوة أصدقاء</span>
      </a>
    </div>

    <!-- CPALead Offerwall Integration -->
    <div class="section-title">
      <h3><i class="fa-solid fa-fire"></i> عروض اليوم الممتازة</h3>
    </div>
    
    <div class="offerwall-box">
      <iframe id="cpa-iframe" src="https://www.appstorevault.mobi/wall/Fja8DpRW" frameborder="0"></iframe>
    </div>

  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
    <a href="wheel.html" class="nav-item"><i class="fa-solid fa-spinner"></i><span>العجلة</span></a>
    <a href="rewards.html" class="nav-item"><i class="fa-solid fa-gift"></i><span>المكافآت</span></a>
    <a href="referral.html" class="nav-item"><i class="fa-solid fa-users"></i><span>الإحالة</span></a>
    <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i><span>حسابي</span></a>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
