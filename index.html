<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loot Play - الصفحة الرئيسية</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- هيدر الصفحة -->
  <header class="navbar">
    <div class="logo">Loot Play</div>
    <div class="user-info">
      <span>النقاط: <strong id="user-points">0</strong> 🪙</span>
      <button id="logout-btn" class="btn-logout">تسجيل الخروج</button>
    </div>
  </header>

  <!-- الحاوية الرئيسية -->
  <main class="container">

    <!-- قسم زر التوجه المباشر إلى CPALead -->
    <section class="cpa-section">
      <h2>🚀 اكسب النقاط الآن عبر CPALead</h2>
      <p>اضغط على الزر أدناه للانتقال إلى عروض CPALead وإكمال المهام لجمع النقاط!</p>
      <a href="https://www.cpalead.com" target="_blank" class="cpa-btn">
        🔥 الانتقال إلى عروض CPALead
      </a>
    </section>

    <!-- قسم عجلة الحظ -->
    <section class="wheel-section">
      <h2>🎡 عجلة الحظ اليومية</h2>
      <div class="wheel-container">
        <canvas id="wheel-canvas" width="300" height="300"></canvas>
        <button id="spin-btn" class="btn-spin">أدر العجلة!</button>
      </div>
    </section>

    <!-- قسم دعوة الأصدقاء -->
    <section class="referral-section">
      <h2>👥 دعوة الأصدقاء</h2>
      <p>شارك رابط الدعوة الخاص بك واحصل على 100 نقطة لكل صديق يسجل في الموقع!</p>
      <div class="ref-box">
        <input type="text" id="ref-link" readonly value="جاري التحميل...">
        <button id="copy-ref-btn" class="btn-copy">نسخ الرابط</button>
      </div>
    </section>

  </main>

  <!-- ربط السكريبت الأساسي -->
  <script type="module" src="app.js"></script>
</body>
</html>
