<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية - MistCash</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="text-align: center; padding: 20px;">
        <h2>مرحباً بك في MistCash</h2>
        <p>رصيدك الحالي: <span id="userPoints" style="color: #eab308; font-weight: bold;">0</span> نقطة</p>
        
        <!-- قسم عجلة الحظ اليومية -->
        <div class="card" style="margin-top: 20px; padding: 20px; background: #1a1700; border: 1px solid #eab308; border-radius: 12px;">
            <h3>عجلة الحظ اليومية</h3>
            <p style="color: #cbd5e1; font-size: 0.9rem;">اضغط لدوران العجلة واربح نقاطاً مجانية كل 24 ساعة!</p>
            <button onclick="spinWheel()" class="btn-yellow" style="margin-top: 15px; padding: 10px 20px; background: #eab308; border: none; font-weight: bold; border-radius: 8px; cursor: pointer;">دوران العجلة</button>
        </div>

        <!-- قسم عروض CPALead -->
```html
        <div class="card" style="margin-top: 20px; padding: 20px; background: #1a1700; border: 1px solid #eab308; border-radius: 12px;">
            <h3>عروض CPALead</h3>
            <p style="color: #cbd5e1; font-size: 0.9rem;">أكمل المهام والعروض لزيادة رصيدك من النقاط فوراً!</p>
            <button onclick="openCPALead()" class="btn-yellow" style="margin-top: 15px; padding: 10px 20px; background: #2563eb; color: #fff; border: none; font-weight: bold; border-radius: 8px; cursor: pointer;">فتح حائط العروض</button>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item active"><span class="nav-icon">🏠</span>الرئيسية</a>
        <a href="referral.html" class="nav-item"><span class="nav-icon">👥</span>الدعوات</a>
        <a href="store.html" class="nav-item"><span class="nav-icon">🎁</span>المتجر</a>
        <a href="purchases.html" class="nav-item"><span class="nav-icon">📦</span>المشتريات</a>
        <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span>حسابي</a>
    </div>

    <script type="module">
        import { initializeApp } from "[https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js](https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js)";
        import { getFirestore, doc, getDoc, updateDoc, setDoc, increment } from "[https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js](https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js)";

        const firebaseConfig = {
          apiKey: "AIzaSyB6rnXLMDlvy0Eezc7MkdmP334EzPTKlGE",
          authDomain: "mistcash-9a71c.firebaseapp.com",
          projectId: "mistcash-9a71c",
          storageBucket: "mistcash-9a71c.firebasestorage.app",
          messagingSenderId: "819929785371",
          appId: "1:819929785371:web:396e322f83319016bb44be",
          measurementId: "G-FGBZZ1P9W6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        if (localStorage.getItem("is_logged_in") !== "true") { 
            window.location.href = "login.html"; 
        }

        const userEmail = localStorage.getItem("user_email");
        const pointsKey = "points_" + userEmail;
        
        let currentPoints = parseInt(localStorage.getItem(pointsKey) || localStorage.getItem("user_points") || "0");
        document.getElementById("userPoints").innerText = currentPoints;

        // دالة إرسال 10% لصاحب الدعوة تلقائياً في السحابة
        async function sendReferralCommission(earnedPoints) {
            const inviterRefCode = localStorage.getItem("my_inviter_ref_code");
            if (inviterRefCode && earnedPoints > 0) {
                const commission = Math.floor(earnedPoints * 0.10);
                if (commission > 0) {
                    try {
                        const bonusRef = doc(db, "referrals_bonus", inviterRefCode);
                        await setDoc(bonusRef, { bonus: increment(commission) }, { merge: true });
                    } catch (err) {
                        console.error("خطأ في إرسال العمولة:", err);
                    }
                }
            }
        }

        // عجلة الحظ
        window.spinWheel = async function() {
            let wonPoints = 50; // يمكنك تعديلها أو ربطها بكود العجلة الخاص بك
            currentPoints += wonPoints;

            localStorage.setItem(pointsKey, currentPoints);
            localStorage.setItem("user_points", currentPoints);
            document.getElementById("userPoints").innerText = currentPoints;

            try {
                const userRef = doc(db, "users", userEmail);
                await updateDoc(userRef, { points: currentPoints });
            } catch (err) {
                console.error("خطأ في تحديث النقاط بالسحابة:", err);
            }

            await sendReferralCommission(wonPoints);
            alert(`مبروك! لقد ربحت ${wonPoints} نقطة وأضيفت لرصيدك.`);
        }

        // زر فتح عروض CPALead
        window.openCPALead = function() {
            window.location.href = "store.html";
        }
    </script>
</body>
</html>
