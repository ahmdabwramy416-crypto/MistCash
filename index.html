<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="monetag" content="607f5591b0ada28fb5607c6ea085ac54">
    <title>الرئيسية - Gamer Pro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .offers-grid { display: grid; gap: 12px; margin-bottom: 25px; }
        
        /* حاوية عجلة الحظ */
        .wheel-box { position: relative; width: 240px; height: 240px; margin: 25px auto 15px auto; }
        
        /* سهم المؤشر في الأعلى */
        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 22px solid #ef4444;
            z-index: 20;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
        }

        /* تصميم عجلة الحظ */
        .wheel-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #eab308;
            background: conic-gradient(
                #eab308 0deg 60deg,
                #ca8a04 60deg 120deg,
                #eab308 120deg 180deg,
                #ca8a04 180deg 240deg,
                #eab308 240deg 300deg,
                #ca8a04 300deg 360deg
            );
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.4);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }

        .wheel-slice { position: absolute; width: 100%; height: 100%; text-align: center; font-weight: bold; font-size: 1.2rem; }
        .s1 { transform: rotate(30deg); padding-top: 10px; }
        .s2 { transform: rotate(90deg); padding-top: 10px; }
        .s3 { transform: rotate(150deg); padding-top: 10px; }
        .s4 { transform: rotate(210deg); padding-top: 10px; }
        .s5 { transform: rotate(270deg); padding-top: 10px; }
        .s6 { transform: rotate(330deg); padding-top: 10px; }

        .wheel-center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #0c0a00; color: #eab308; width: 70px; height: 70px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: bold; border: 3px solid #eab308; cursor: pointer; z-index: 10;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* تنسيق مخصص لشريط التنقل ليتسع لـ 6 أزرار بانتظام */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #1a1700; border-top: 2px solid #eab308; display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; box-shadow: 0 -4px 20px rgba(234, 179, 8, 0.15); }
        .nav-item { color: #cbd5e1; text-decoration: none; font-size: 0.65rem; text-align: center; display: flex; flex-direction: column; align-items: center; transition: 0.3s; flex: 1; }
        .nav-item.active, .nav-item:hover { color: #eab308; transform: translateY(-2px); }
        .nav-icon { font-size: 1.1rem; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="header container" style="display: flex; justify-content: space-between; align-items: center; padding: 15px;">
        <h2>Gamer Pro</h2>
        <!-- تم فصل النقاط وتنظيف خانتها تماماً لتظهر بشكل مرتب -->
        <div class="points-box" style="background: #1a1700; border: 1px solid #eab308; padding: 8px 15px; border-radius: 8px; color: #eab308; font-weight: bold;">
            النقاط: <span id="userPoints" style="color: #fff;">0</span>
        </div>
    </div>

    <div class="container">
        <!-- أزرار لشركات العروض -->
        <div class="card" style="text-align: center;">
            <h3 style="margin-bottom: 15px;">شركات حائط العروض</h3>
            <div class="offers-grid">
                <a href="#" id="cpalead-link" target="_blank" class="btn-yellow">1. عروض CPALead</a>
                <a href="#" id="cpagrip-link" target="_blank" class="btn-yellow">2. عروض CPAGrip</a>
                <a href="#" target="_blank" class="btn-yellow">3. AdGate عروض إضافية</a>
            </div>
        </div>

        <!-- عجلة الحظ مع السهم والأرقام -->
        <div class="card" style="text-align: center;">
            <h3>عجلة الحظ اليومية</h3>
            <p style="color: #cbd5e1; font-size: 0.85rem; margin-top: 5px;">تدور المجلة مرة واحدة كل 24 ساعة واربح حتى 100 نقطة!</p>
            
            <div class="wheel-box">
                <div class="wheel-pointer"></div>
                
                <div class="wheel-container" id="wheel">
                    <div class="wheel-slice s1">20</div>
                    <div class="wheel-slice s2">50</div>
                    <div class="wheel-slice s3">100</div>
                    <div class="wheel-slice s4">5</div>
                    <div class="wheel-slice s5">25</div>
                    <div class="wheel-slice s6">10</div>
                    <div class="wheel-center" onclick="spinWheel()">ابدأ</div>
                </div>
            </div>

            <p id="wheelResult" style="color: #eab308; font-weight: bold; margin-top: 15px;"></p>
        </div>
    </div>

    <!-- شريط التنقل السفلي المحدث (6 أزرار صحيحة) -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item active"><span class="nav-icon">🏠</span>الرئيسية</a>
        <a href="videos.html" class="nav-item"><span class="nav-icon">🎬</span>فيديوهات</a>
        <a href="referral.html" class="nav-item"><span class="nav-icon">👥</span>الدعوات</a>
        <a href="store.html" class="nav-item"><span class="nav-icon">🔥</span>المتجر</a>
        <a href="purchases.html" class="nav-item"><span class="nav-icon">📦</span>المشتريات</a>
        <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span>حسابي</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, updateDoc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyB6rnXLMDlvy0Eezc7MkdmP334EzPTKlGE",
          authDomain: "mistcash-9a71c.firebaseapp.com",
          projectId: "mistcash-9a71c",
          storageBucket: "mistcash-9a71c.firebasestorage.app",
          messagingSenderId: "819929785371",
          appId: "1:819929785371:web:396e322f83319016bb44be",
          measurementId: "G-FGBZZ1P9W6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        if (localStorage.getItem("is_logged_in") !== "true") { window.location.href = "login.html"; }

        const userEmail = localStorage.getItem("user_email");
        const pointsKey = "points_" + userEmail;
        const lastSpinKey = "last_spin_time_" + userEmail;

        // جلب الـ uid الحقيقي من Firebase وتحديث روابط شركات العروض تلقائياً
        onAuthStateChanged(auth, (user) => {
            if (user) {
                const userId = user.uid; // معرف المستخدم من قاعدة البيانات
                
                // تحديث رابط CPALead
                const cpaleadLink = document.getElementById("cpalead-link");
                if (cpaleadLink) {
                    cpaleadLink.href = "https://www.lnksforyou.com/wall/2qQGUmC?subid=" + userId;
                }

                // تحديث رابط CPAGrip (تم تعديله ليفتح صفحة العروض مباشرة بدون ظهور الأكواد البرمجية)
                const cpagripLink = document.getElementById("cpagrip-link");
                if (cpagripLink) {
                    cpagripLink.href = "https://doctoredits.com/g/1913952?subid=" + userId;
                }
            }
        });

        async function updatePoints() {
            let currentVal = localStorage.getItem(pointsKey) || "0";
            document.getElementById("userPoints").innerText = currentVal;
            localStorage.setItem("user_points", currentVal);

            try {
                const userRef = doc(db, "users", userEmail);
                await updateDoc(userRef, { points: parseInt(currentVal) });
            } catch (err) {
                console.error("خطأ في تحديث النقاط بالسحابة:", err);
            }
        }
        updatePoints();

        async function sendReferralCommission(earnedPoints) {
            const inviterRefCode = localStorage.getItem("my_inviter_ref_code");
            if (inviterRefCode && earnedPoints > 0) {
                const commission = Math.floor(earnedPoints * 0.10);
                if (commission > 0) {
                    try {
                        const bonusRef = doc(db, "referrals_bonus", inviterRefCode);
                        await setDoc(bonusRef, { bonus: increment(commission) }, { merge: true });
                    } catch (err) {
                        console.error("خطأ في إرسال العمولة:", err);
                    }
                }
            }
        }

        function checkSpinAvailability() {
            const lastSpinTime = localStorage.getItem(lastSpinKey);
            const resultText = document.getElementById("wheelResult");

            if (lastSpinTime) {
                const now = new Date().getTime();
                const elapsedHours = (now - parseInt(lastSpinTime)) / (1000 * 60 * 60);

                if (elapsedHours < 24) {
                    const remainingHours = Math.ceil(24 - elapsedHours);
                    resultText.innerText = `لقد قمت بتدوير المجلة اليوم! يمكنك المحاولة مرة أخرى بعد ${remainingHours} ساعة.`;
                    return false;
                }
            }
            return true;
        }
        checkSpinAvailability();

        let isSpinning = false;
        window.spinWheel = async function() {
            if (isSpinning) return;

            const lastSpinTime = localStorage.getItem(lastSpinKey);
            const resultText = document.getElementById("wheelResult");

            if (lastSpinTime) {
                const now = new Date().getTime();
                const elapsedHours = (now - parseInt(lastSpinTime)) / (1000 * 60 * 60);
                if (elapsedHours < 24) {
                    const remainingHours = Math.ceil(24 - elapsedHours);
                    alert(`عذراً! يمكنك تدوير المجلة مرة واحدة كل 24 ساعة. متبقي ${remainingHours} ساعة.`);
                    return;
                }
            }

            isSpinning = true;
            resultText.innerText = "جاري تدوير المجلة...";

            const rewards = [20, 50, 100, 5, 25, 10];
            const randomIndex = Math.floor(Math.random() * rewards.length);
            const wonPoints = rewards[randomIndex];

            const degreesPerSlice = 60;
            const targetDegree = 1440 + (randomIndex * degreesPerSlice);

            const wheel = document.getElementById("wheel");
            wheel.style.transform = `rotate(${targetDegree}deg)`;

            setTimeout(async () => {
                let currentPoints = parseInt(localStorage.getItem(pointsKey) || "0");
                currentPoints += wonPoints;

                const currentTime = new Date().getTime();
                localStorage.setItem(pointsKey, currentPoints);
                localStorage.setItem(lastSpinKey, currentTime.toString());

                await updatePoints();
                await sendReferralCommission(wonPoints);

                resultText.innerText = `مبروك! ربحت وتم إضافتها لرصيدك ${wonPoints} نقطة`;
                isSpinning = false;
            }, 4000);
        }
    </script>
</body>
</html>
