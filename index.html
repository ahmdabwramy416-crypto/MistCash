<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية - MistCash</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .offers-grid { display: grid; gap: 12px; margin-bottom: 25px; }
        .wheel-container { position: relative; width: 220px; height: 220px; margin: 15px auto; border-radius: 50%; border: 6px solid #eab308; background: conic-gradient(#eab308 0deg 90deg, #ca8a04 90deg 180deg, #eab308 180deg 270deg, #ca8a04 270deg 360deg); display: flex; align-items: center; justify-content: center; transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99); }
        .wheel-center { background: #0c0a00; color: #eab308; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 3px solid #eab308; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header container">
        <h2>MistCash</h2>
        <div class="points-box">الرصيد: <span id="userPoints">0</span> نقطة</div>
    </div>

    <div class="container">
        <!-- 3 أزرار لشركات العروض -->
        <div class="card" style="text-align: center;">
            <h3 style="margin-bottom: 15px;">شركات حائط العروض</h3>
            <div class="offers-grid">
                <a href="https://www.cpalead.com/wall/YOUR_SLUG_1" target="_blank" class="btn-yellow">1. شركة CPALead للعروض</a>
                <a href="https://www.offerwall2.com/YOUR_SLUG_2" target="_blank" class="btn-yellow">2. شركة OfferWall الثانية</a>
                <a href="https://www.offerwall3.com/YOUR_SLUG_3" target="_blank" class="btn-yellow">3. شركة AdGate / عروض إضافية</a>
            </div>
        </div>

        <!-- عجلة الحظ الحقيقية -->
        <div class="card" style="text-align: center;">
            <h3>عجلة الحظ اليومية</h3>
            <p style="color: #cbd5e1; font-size: 0.85rem; margin-top: 5px;">اضغط على الدائرة لتدوير العجلة واربح نقاطاً حقيقية!</p>
            <div class="wheel-container" id="wheel">
                <div class="wheel-center" onclick="spinWheel()">ابدأ</div>
            </div>
            <p id="wheelResult" style="color: #eab308; font-weight: bold; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item active"><span class="nav-icon">🏠</span>الرئيسية</a>
        <a href="referral.html" class="nav-item"><span class="nav-icon">👥</span>الدعوات</a>
        <a href="store.html" class="nav-item"><span class="nav-icon">🎁</span>المتجر</a>
        <a href="purchases.html" class="nav-item"><span class="nav-icon">📦</span>المشتريات</a>
        <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span>حسابي</a>
    </div>

    <script>
        if (localStorage.getItem("is_logged_in") !== "true") { window.location.href = "login.html"; }
        function updatePoints() { document.getElementById("userPoints").innerText = localStorage.getItem("user_points") || "0"; }
        updatePoints();

        let isSpinning = false;
        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            const wheel = document.getElementById("wheel");
            const resultText = document.getElementById("wheelResult");
            resultText.innerText = "جاري تدوير العجلة...";
            
            const randomDegree = Math.floor(Math.random() * 360) + 1440;
            wheel.style.transform = `rotate(${randomDegree}deg)`;

            setTimeout(() => {
                const rewards = [10, 20, 50, 100, 5, 25];
                const wonPoints = rewards[Math.floor(Math.random() * rewards.length)];
                let currentPoints = parseInt(localStorage.getItem("user_points") || "0");
                currentPoints += wonPoints;
                localStorage.setItem("user_points", currentPoints);
                updatePoints();
                resultText.innerText = `مبروك! ربحت ${wonPoints} نقطة حقيقية!`;
                isSpinning = false;
            }, 4000);
        }
    </script>
</body>
</html>
