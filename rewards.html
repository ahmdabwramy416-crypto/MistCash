<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loot Play - متجر المكافآت</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .rewards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding: 15px;
    }
    .reward-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .reward-card img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }
    .claim-btn {
      background: var(--accent-gold);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header class="top-header">
    <div style="font-weight: bold; color: var(--accent-yellow);">LOOT PLAY</div>
    <div class="coin-badge">
      <i class="fa-solid fa-coins"></i>
      <span id="user-points">0</span>
    </div>
  </header>

  <div class="section-title" style="margin-top: 15px;">
    <i class="fa-solid fa-store"></i>
    <h3>استبدل نقاطك بالجوائز</h3>
  </div>

  <div class="rewards-grid">
    <!-- Google Play -->
    <div class="reward-card">
      <i class="fa-brands fa-google-play" style="font-size: 45px; color: #34a853;"></i>
      <h4>بطاقة $5 Google Play</h4>
      <span style="color: var(--accent-yellow); font-size: 13px;">5,000 نقطة</span>
      <button class="claim-btn">سحب الآن</button>
    </div>

    <!-- PUBG UC -->
    <div class="reward-card">
      <i class="fa-solid fa-gamepad" style="font-size: 45px; color: #f59e0b;"></i>
      <h4>60 شدة PUBG UC</h4>
      <span style="color: var(--accent-yellow); font-size: 13px;">1,200 نقطة</span>
      <button class="claim-btn">سحب الآن</button>
    </div>

    <!-- Free Fire Diamonds -->
    <div class="reward-card">
      <i class="fa-solid fa-gem" style="font-size: 45px; color: #3b82f6;"></i>
      <h4>110 جوهرة Free Fire</h4>
      <span style="color: var(--accent-yellow); font-size: 13px;">1,000 نقطة</span>
      <button class="claim-btn">سحب الآن</button>
    </div>

    <!-- Payeer / Cash -->
    <div class="reward-card">
      <i class="fa-solid fa-wallet" style="font-size: 45px; color: #10b981;"></i>
      <h4>$1 Payeer Cash</h4>
      <span style="color: var(--accent-yellow); font-size: 13px;">1,000 نقطة</span>
      <button class="claim-btn">سحب الآن</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
    <a href="wheel.html" class="nav-link"><i class="fa-solid fa-dharmachakra"></i><span>العجلة</span></a>
    <a href="rewards.html" class="nav-link active"><i class="fa-solid fa-gift"></i><span>المكافآت</span></a>
    <a href="referral.html" class="nav-link"><i class="fa-solid fa-users"></i><span>الإحالة</span></a>
    <a href="profile.html" class="nav-link"><i class="fa-solid fa-user"></i><span>حسابي</span></a>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
