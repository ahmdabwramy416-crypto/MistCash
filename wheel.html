<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loot Play - عجلة الحظ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .wheel-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 30px;
    }
    .wheel {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 8px solid var(--accent-gold);
      background: conic-gradient(#f59e0b 0 60deg, #181a24 60deg 120deg, #fbbf24 120deg 180deg, #181a24 180deg 240deg, #f59e0b 240deg 300deg, #181a24 300deg 360deg);
      position: relative;
      transition: transform 4s cubic-bezier(0.15, 0.99, 0.18, 0.99);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
    }
    .spin-btn {
      margin-top: 30px;
      background: linear-gradient(135deg, #f59e0b, #fbbf24);
      color: #000;
      border: none;
      padding: 14px 40px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
    }
    .pointer {
      width: 0; 
      height: 0; 
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid #fff;
      margin-bottom: -10px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <header class="top-header">
    <div style="font-weight: bold; color: var(--accent-yellow);">LOOT PLAY</div>
    <div class="coin-badge">
      <i class="fa-solid fa-coins"></i>
      <span id="user-points">0</span>
    </div>
  </header>

  <main class="wheel-container">
    <h2 style="color: var(--accent-yellow); margin-bottom: 10px;">عجلة الحظ اليومية 🎡</h2>
    <p style="color: #aaa; font-size: 13px;">أدر العجلة واكسب نقاطاً إضافية يومياً!</p>

    <div class="pointer"></div>
    <div class="wheel" id="wheel"></div>

    <button class="spin-btn" id="spin-btn">أدر العجلة الآن!</button>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
    <a href="wheel.html" class="nav-link active"><i class="fa-solid fa-dharmachakra"></i><span>العجلة</span></a>
    <a href="rewards.html" class="nav-link"><i class="fa-solid fa-gift"></i><span>المكافآت</span></a>
    <a href="referral.html" class="nav-link"><i class="fa-solid fa-users"></i><span>الإحالة</span></a>
    <a href="profile.html" class="nav-link"><i class="fa-solid fa-user"></i><span>حسابي</span></a>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
