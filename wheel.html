<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loot Play - عجلة الحظ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .wheel-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }
    .wheel-box {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 20px 0;
    }
    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 5px solid var(--accent-yellow);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
    }
    .pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 24px solid #ef4444;
      z-index: 10;
    }
  </style>
</head>
<body>

  <header class="top-header">
    <div style="font-weight: bold; color: var(--accent-yellow);">LOOT PLAY</div>
    <div class="coin-badge">
      <i class="fa-solid fa-coins"></i>
      <span id="user-points">0</span>
    </div>
  </header>

  <main class="wheel-container">
    <h2 style="color: #fff; margin-bottom: 5px;">عجلة الحظ اليومية 🎡</h2>
    <p style="color: #aaa; font-size: 13px;">أدر العجلة واكسب نقاطاً مجانية فورية!</p>

    <div class="wheel-box">
      <div class="pointer"></div>
      <canvas id="wheel-canvas" width="300" height="300"></canvas>
    </div>

    <button id="spin-btn" style="padding: 12px 40px; border-radius: 10px; border: none; background: var(--accent-gold); color: #000; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s;">
      تدوير (مجاني)
    </button>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
    <a href="wheel.html" class="nav-link active"><i class="fa-solid fa-dharmachakra"></i><span>العجلة</span></a>
    <a href="rewards.html" class="nav-link"><i class="fa-solid fa-gift"></i><span>المكافآت</span></a>
    <a href="referral.html" class="nav-link"><i class="fa-solid fa-users"></i><span>الإحالة</span></a>
    <a href="profile.html" class="nav-link"><i class="fa-solid fa-user"></i><span>حسابي</span></a>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
