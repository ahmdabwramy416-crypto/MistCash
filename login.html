<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - MistCash</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
        .login-card { background: #1a1700; border: 2px solid #eab308; border-radius: 16px; padding: 35px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 8px 30px rgba(234, 179, 8, 0.25); }
        h2 { color: #eab308; margin-bottom: 15px; font-size: 1.8rem; }
        p { color: #cbd5e1; font-size: 0.95rem; margin-bottom: 25px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>منصة MistCash</h2>
        <p>سجل دخولك بحساب جوجل وابدأ بجمع النقاط وحفظها بشكل دائم في السحابة!</p>
        <div style="display: flex; justify-content: center;">
            <div id="g_id_onload"
                 data-client_id="855781354859-0kf6q6rsi1al5n4ej3pg1o61blsouvdm.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_yellow" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left"></div>
        </div>
    </div>

    <!-- استدعاء مكتبات Firebase (Firestore) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyB6rnXLMDlvy0Eezc7MkdmP334EzPTKlGE",
          authDomain: "mistcash-9a71c.firebaseapp.com",
          projectId: "mistcash-9a71c",
          storageBucket: "mistcash-9a71c.firebasestorage.app",
          messagingSenderId: "819929785371",
          appId: "1:819929785371:web:396e322f83319016bb44be",
          measurementId: "G-FGBZZ1P9W6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // التحقق إذا كان المستخدم مسجلاً مسبقاً
        if (localStorage.getItem("is_logged_in") === "true") { 
            window.location.href = "index.html"; 
        }

        // التقاط كود الإحالة من الرابط وحفظه مؤقتاً
        const urlParams = new URLSearchParams(window.location.search);
        const refCode = urlParams.get('ref');
        if (refCode) {
            localStorage.setItem("pending_ref_code", refCode);
        }

        window.handleCredentialResponse = async function(response) {
            const payload = parseJwt(response.credential);
            const userEmail = payload.email;
            
            // حفظ البيانات الأساسية محلياً لتسهيل التصفح
            localStorage.setItem("user_name", payload.name);
            localStorage.setItem("user_email", userEmail);
            localStorage.setItem("user_picture", payload.picture || "");
            localStorage.setItem("is_logged_in", "true");

            const userRef = doc(db, "users", userEmail);
            const userSnap = await getDoc(userRef);

            if (!userSnap.exists()) {
                // مستخدم جديد تماماً: إنشاء حسابه في Firestore ومنحه 50 نقطة ترحيبية
                let initialPoints = 50;
                let myUniqueCode = btoa(userEmail).substring(0, 8);

                await setDoc(userRef, {
                    email: userEmail,
                    name: payload.name,
                    points: initialPoints,
                    refCode: myUniqueCode,
                    refBonus: 0
                });

                localStorage.setItem("user_points", initialPoints);

                // التحقق من وجود كود إحالة لصديق دعاه
                const savedRefCode = localStorage.getItem("pending_ref_code");
                if (savedRefCode && savedRefCode !== myUniqueCode) {
                    // البحث عن صاحب الدعوة وإضافة 50 نقطة مكافأة له في السحابة
                    // سنقوم بالبحث في قاعدة البيانات عبر كود الإحالة
                    try {
                        // سنقوم بتحديث رصيد الإحالة المعلق لصاحب الكود
                        // لتسهيل الأمر سنستخدم استعلام أو تحديث مباشر إذا وجد المستند
                        const allUsersRef = doc(db, "referrals_bonus", savedRefCode);
                        await setDoc(allUsersRef, {
                            bonus: increment(50)
                        }, { merge: true });
                        
                        localStorage.removeItem("pending_ref_code");
                    } catch (err) {
                        console.error("Error adding referral bonus:", err);
                    }
                }
            } else {
                // مستخدم قديم: جلب نقاطه الحقيقية من قاعدة البيانات
                const userData = userSnap.data();
                localStorage.setItem("user_points", userData.points || 0);
            }

            window.location.href = "index.html";
        }

        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
        }
    </script>
</body>
</html>
