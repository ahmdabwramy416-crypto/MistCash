<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - MistCash</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', Tahoma, sans-serif; }
        body { background-color: #0d0519; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
        .login-card { background: #1a0b2e; border: 2px solid #eab308; border-radius: 16px; padding: 35px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(234, 179, 8, 0.2); text-align: center; }
        h2 { color: #eab308; margin-bottom: 15px; font-size: 1.8rem; }
        p { color: #cbd5e1; font-size: 0.95rem; margin-bottom: 25px; line-height: 1.6; }
        .button-container { display: flex; justify-content: center; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>منصة MistCash</h2>
        <p>سجل دخولك الآن بحساب جوجل وابدأ بجمع النقاط وسحب الهدايا مجاناً!</p>
        
        <div class="button-container">
            <div id="g_id_onload"
                 data-client_id="855781354859-0kf6q6rsi1al5n4ej3pg1o61blsouvdm.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_yellow" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left"></div>
        </div>
    </div>

    <script>
        if (localStorage.getItem("is_logged_in") === "true") {
            window.location.href = "index.html";
        }
        function handleCredentialResponse(response) {
            const payload = parseJwt(response.credential);
            localStorage.setItem("user_name", payload.name);
            localStorage.setItem("user_email", payload.email);
            localStorage.setItem("user_picture", payload.picture || "");
            localStorage.setItem("is_logged_in", "true");
            
            if (!localStorage.getItem("user_points")) localStorage.setItem("user_points", "50"); // هدية تسجيل 50 نقطة
            if (!localStorage.getItem("user_purchases")) localStorage.setItem("user_purchases", JSON.stringify([]));
            
            window.location.href = "index.html";
        }
        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
        }
    </script>
</body>
</html>
