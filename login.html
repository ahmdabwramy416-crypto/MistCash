<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - MistCash</title>
    <!-- استدعاء مكتبة تسجيل الدخول من جوجل -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', Tahoma, sans-serif; }
        body { background-color: #0d0519; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
        .login-card { background: #1a0b2e; border: 1px solid #3b1568; border-radius: 16px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
        h2 { color: #c084fc; margin-bottom: 15px; font-size: 1.5rem; }
        p { color: #aaa; font-size: 0.9rem; margin-bottom: 25px; }
        .button-container { display: flex; justify-content: center; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>تسجيل الدخول إلى MistCash</h2>
        <p>سجل دخولك باستخدام حساب جوجل للوصول إلى مكافآتك ونقاطك</p>
        
        <!-- حاوية زر جوجل -->
        <div class="button-container">
            <div id="g_id_onload"
                 data-client_id="855781354859-0kf6q6rsi1al5n4ej3pg1o61blsouvdm.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-size="large"
                 data-theme="outline"
                 data-text="sign_in_with"
                 data-shape="rectangular"
                 data-logo_alignment="left">
            </div>
        </div>
    </div>

    <script>
        // التحقق المسبق: إذا كان مسجلاً مسبقاً، وجهه للبروفايل فوراً دون الحاجة لإعادة الضغط
        if (localStorage.getItem("is_logged_in") === "true") {
            window.location.href = "profile.html";
        }

        function handleCredentialResponse(response) {
            const responsePayload = parseJwt(response.credential);
            
            // تخزين بيانات المستخدم بشكل دائم في الـ localStorage
            localStorage.setItem("user_name", responsePayload.name);
            localStorage.setItem("user_email", responsePayload.email);
            localStorage.setItem("user_picture", responsePayload.picture || "");
            localStorage.setItem("is_logged_in", "true");
            
            if (!localStorage.getItem("user_points")) {
                localStorage.setItem("user_points", "0");
            }

            // الانتقال الفوري لصفحة الملف الشخصي
            window.location.href = "profile.html";
        }

        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }
    </script>

</body>
</html>
