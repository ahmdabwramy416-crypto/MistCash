<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loot Play - تسجيل الدخول</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box;">

  <div style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 25px; width: 100%; max-width: 400px; text-align: center;">
    
    <div style="font-size: 24px; font-weight: bold; color: var(--accent-yellow); margin-bottom: 5px;">LOOT PLAY</div>
    <p style="color: #aaa; font-size: 13px; margin-bottom: 20px;">قم بتسجيل الدخول لبدء جمع النقاط</p>

    <!-- زر تسجيل الدخول بجوجل -->
    <button id="google-btn" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #4285F4; background: #4285F4; color: #fff; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px;">
      <i class="fa-brands fa-google" style="font-size: 18px;"></i>
      المتابعة باستخدام Google
    </button>

    <div style="display: flex; align-items: center; margin: 15px 0; color: #666;">
      <hr style="flex: 1; border: 0; border-top: 1px solid var(--border-color);">
      <span style="padding: 0 10px; font-size: 12px;">أو البريد الإلكتروني</span>
      <hr style="flex: 1; border: 0; border-top: 1px solid var(--border-color);">
    </div>

    <!-- نموذج البريد وكلمة المرور -->
    <form id="login-form" style="display: flex; flex-direction: column; gap: 12px;">
      <input type="email" id="login-email" placeholder="البريد الإلكتروني" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: #0c0d12; color: #fff; box-sizing: border-box;">
      <input type="password" id="login-password" placeholder="كلمة المرور" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: #0c0d12; color: #fff; box-sizing: border-box;">
      <button type="submit" style="width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--accent-gold); color: #000; font-weight: bold; cursor: pointer;">دخول</button>
    </form>

    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

    <form id="signup-form" style="display: flex; flex-direction: column; gap: 12px;">
      <h3 style="color: #fff; font-size: 14px; margin: 0;">إنشاء حساب جديد</h3>
      <input type="email" id="signup-email" placeholder="البريد الإلكتروني" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: #0c0d12; color: #fff; box-sizing: border-box;">
      <input type="password" id="signup-password" placeholder="كلمة المرور" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: #0c0d12; color: #fff; box-sizing: border-box;">
      <button type="submit" style="width: 100%; padding: 12px; border-radius: 8px; border: none; background: #10b981; color: #fff; font-weight: bold; cursor: pointer;">إنشاء حساب</button>
    </form>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
