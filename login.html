<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loot Play - تسجيل الدخول</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">

  <div style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 25px; width: 100%; max-width: 400px; text-align: center;">
    
    <div style="font-size: 24px; font-weight: bold; color: var(--accent-yellow); margin-bottom: 5px;">LOOT PLAY</div>
    <p style="color: #aaa; font-size: 13px; margin-bottom: 20px;">قم بتسجيل الدخول أو إنشاء حساب لبدء جمع النقاط</p>

    <!-- نموذج تسجيل الدخول -->
    <form id="login-form" style="display: flex; flex-direction: column; gap: 12px;">
      <h3 style="color: #fff; font-size: 16px;">تسجيل الدخول</h3>
      <input type="email" id="login-email" placeholder="البريد الإلكتروني" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: #0c0d12; color: #fff;">
      <input type="password" id="login-password" placeholder="كلمة المرور" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: #0c0d12; color: #fff;">
      <button type="submit" style="width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--accent-gold); color: #000; font-weight: bold; cursor: pointer;">دخول</button>
    </form>

    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

    <!-- نموذج إنشاء حساب -->
    <form id="signup-form" style="display: flex; flex-direction: column; gap: 12px;">
      <h3 style="color: #fff; font-size: 16px;">إنشاء حساب جديد</h3>
      <input type="email" id="signup-email" placeholder="البريد الإلكتروني" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: #0c0d12; color: #fff;">
      <input type="password" id="signup-password" placeholder="كلمة المرور" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: #0c0d12; color: #fff;">
      <button type="submit" style="width: 100%; padding: 12px; border-radius: 8px; border: none; background: #10b981; color: #fff; font-weight: bold; cursor: pointer;">إنشاء حساب</button>
    </form>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
