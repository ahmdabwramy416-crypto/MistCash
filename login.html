<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MistCash - تسجيل الدخول</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d0519; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
        .auth-container { background: #1a0b2e; border: 1px solid #3b1568; border-radius: 16px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
        h2 { color: #c084fc; margin-bottom: 20px; font-size: 1.5rem; }
        .input-group { margin-bottom: 15px; text-align: right; }
        label { display: block; font-size: 0.85rem; color: #e9d5ff; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #4c1d95; background: #0d0519; color: white; font-size: 1rem; }
        input:focus { outline: none; border-color: #a855f7; }
        .auth-btn { background: #7c3aed; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1rem; margin-top: 10px; transition: 0.2s; }
        .auth-btn:hover { background: #9333ea; }
        .toggle-text { margin-top: 15px; font-size: 0.85rem; color: #aaa; cursor: pointer; }
        .toggle-text span { color: #c084fc; font-weight: bold; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2 id="form-title">تسجيل الدخول</h2>
        
        <div class="input-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="email" placeholder="example@gmail.com">
        </div>
        
        <div class="input-group">
            <label>كلمة المرور</label>
            <input type="password" id="password" placeholder="********">
        </div>

        <button class="auth-btn" id="action-btn" onclick="handleAuth()">دخول</button>
        
        <div class="toggle-text" onclick="toggleMode()">
            <span id="toggle-link">ليس لديك حساب؟ انقر هنا لإنشاء حساب جديد</span>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDwecoLNEfzLufKWKFK4ps6PqqjE2EIXEQ",
            authDomain: "loot-play-71c16.firebaseapp.com",
            databaseURL: "https://loot-play-71c16-default-rtdb.firebaseio.com",
            projectId: "loot-play-71c16",
            storageBucket: "loot-play-71c16.firebasestorage.app",
            appId: "1:477272517069:web:72ab9748e4afc97f5dfc84"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let isSignUp = false;

        function toggleMode() {
            isSignUp = !isSignUp;
            document.getElementById("form-title").innerText = isSignUp ? "إنشاء حساب جديد" : "تسجيل الدخول";
            document.getElementById("action-btn").innerText = isSignUp ? "إنشاء حساب" : "دخول";
            document.getElementById("toggle-link").innerText = isSignUp ? "لديك حساب بالفعل؟ انقر هنا لتسجيل الدخول" : "ليس لديك حساب؟ انقر هنا لإنشاء حساب جديد";
        }

        function handleAuth() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if (!email || !password) {
                alert("الرجاء إدخال البريد وكلمة المرور");
                return;
            }

            if (isSignUp) {
                // إنشاء حساب جديد
                auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = user.user;
                    // تهيئة رصيد النقاط للمستخدم الجديد في قاعدة البيانات
                    database.ref('users/' + user.uid).set({
                        email: user.email,
                        points: 0
                    });
                    alert("تم إنشاء الحساب بنجاح!");
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    alert("خطأ في الإنشاء: " + error.message);
                });
            } else {
                // تسجيل الدخول
                auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    alert("خطأ في تسجيل الدخول: تأكد من البريد وكلمة المرور");
                });
            }
        }
    </script>
</body>
</html>
