<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - MistCash</title>
    <!-- استدعاء مكتبة تسجيل الدخول من جوجل -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h2 {
            color: #333;
            margin-bottom: 25px;
        }
        .button-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>تسجيل الدخول إلى MistCash</h2>
        <p>سجل دخولك باستخدام حساب جوجل للوصول إلى مكافآتك</p>
        
        <!-- إعداد حاوية زر جوجل -->
        <div class="button-container">
            <div id="g_id_onload"
                 data-client_id="855781354859-0kf6q6rsi1al5n4ej3pg1o61blsouvdm.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-size="large"
                 data-theme="outline"
                 data-text="sign_in_with"
                 data-shape="rectangular"
                 data-logo_alignment="left">
            </div>
        </div>
    </div>

    <script>
        // هذه الدالة تعمل تلقائياً عند نجاح تسجيل الدخول بجوجل
        function handleCredentialResponse(response) {
            console.EncodedToken = response.credential;
            
            // فك تشفير البيانات البسيطة للاستفادة منها (اسم المستخدم، البريد، الصورة)
            const responsePayload = parseJwt(response.credential);
            
            // تخزين بيانات المستخدم محلياً في المتصفح
            localStorage.setItem("user_name", responsePayload.name);
            localStorage.setItem("user_email", responsePayload.email);
            localStorage.setItem("user_picture", responsePayload.picture);
            localStorage.setItem("is_logged_in", "true");

            // التوجيه إلى صفحة الملف الشخصي أو الرئيسية بعد الدخول الناجح
            window.location.href = "profile.html";
        }

        // دالة مساعدة لفك تشفير بيانات رمز جوجل (JWT)
        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }
    </script>

</body>
</html>
