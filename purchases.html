<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المشتريات - MistCash</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', Tahoma, sans-serif; }
        body { background-color: #0d0519; color: #ffffff; padding: 20px; }
        .card { background: #1a0b2e; border: 1px solid #3b1568; border-radius: 16px; padding: 25px; max-width: 600px; margin: 0 auto 20px auto; }
        h2 { color: #eab308; text-align: center; margin-bottom: 20px; }
        .purchase-item { background: #2a1147; padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #4c1d95; display: flex; justify-content: space-between; align-items: center; }
        .code { color: #4ade80; font-weight: bold; background: #0d0519; padding: 5px 10px; border-radius: 6px; }
        .back-btn { display: block; width: 100%; max-width: 200px; margin: 20px auto; background: #7c3aed; color: #fff; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>سجل المشتريات والهدايا</h2>
        <div id="purchasesList">
            <p style="text-align: center; color: #aaa;">جاري التحميل...</p>
        </div>
    </div>
    <a href="index.html" class="back-btn">العودة للرئيسية</a>

    <script>
        if (localStorage.getItem("is_logged_in") !== "true") {
            window.location.href = "login.html";
        }

        const purchases = JSON.parse(localStorage.getItem("user_purchases") || "[]");
        const listContainer = document.getElementById("purchasesList");

        if (purchases.length === 0) {
            listContainer.innerHTML = '<p style="text-align: center; color: #aaa;">ليس لديك أي مشتريات حتى الآن. توجه للمتجر وابدأ الاستبدال!</p>';
        } else {
            listContainer.innerHTML = "";
            purchases.forEach(p => {
                listContainer.innerHTML += `
                    <div class="purchase-item">
                        <div>
                            <strong>${p.item}</strong>
                            <div style="font-size: 0.8rem; color: #aaa; margin-top: 3px;">التاريخ: ${p.date}</div>
                        </div>
                        <div class="code">${p.code}</div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
