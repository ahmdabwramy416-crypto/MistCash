<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MistCash - مشترياتي وسجل السحب</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- الشريط العلوي -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-coins logo-icon"></i>
            <span>MistCash</span>
        </div>
        <div class="user-stats">
            <div class="stat-badge">
                <i class="fa-solid fa-wallet"></i>
                <span id="user-points">0</span> نقطة
            </div>
        </div>
    </header>

    <!-- محتوى الصفحة -->
    <main class="container">
        <section class="welcome-section">
            <h2>سجل المشتريات والمكافآت <i class="fa-solid fa-bag-shopping"></i></h2>
            <p>هنا تجد جميع الطلبات والمكافآت التي قمت باستبدالها وحالة كل طلب.</p>
        </section>

        <section class="rewards-section">
            <div class="section-title">
                <h3>طلبات السحب الأخيرة</h3>
            </div>

            <!-- جدول أو قائمة المشتريات -->
            <div id="purchases-list" class="grid-cards">
                <!-- حالة عدم وجود مشتريات (تظهر افتراضياً) -->
                <div class="card" style="grid-column: 1 / -1; text-align: center; padding: 40px 20px;">
                    <i class="fa-solid fa-box-open" style="font-size: 48px; color: #94a3b8; margin-bottom: 15px;"></i>
                    <h4 style="margin-bottom: 10px; color: #f8fafc;">لا توجد مشتريات بعد</h4>
                    <p style="color: #94a3b8; margin-bottom: 20px;">لم تقم باستبدال نقاطك بأي مكافأة حتى الآن.</p>
                    <a href="rewards.html" class="btn-action" style="display: inline-block; width: auto; padding: 10px 25px; text-decoration: none;">استبدل نقاطك الآن</a>
                </div>
            </div>
        </section>
    </main>

    <!-- شريط التنقل السفي -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>الرئيسية</span>
        </a>
        <a href="rewards.html" class="nav-item">
            <i class="fa-solid fa-gift"></i>
            <span>الجوائز</span>
        </a>
        <a href="purchases.html" class="nav-item active">
            <i class="fa-solid fa-bag-shopping"></i>
            <span>مشترياتي</span>
        </a>
        <a href="referral.html" class="nav-item">
            <i class="fa-solid fa-users"></i>
            <span>الإحالة</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>حسابي</span>
        </a>
    </nav>

</body>
</html>
