<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loot Play - المشتريات والسحوبات</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 15px;
    }
    .history-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-pending {
      background: rgba(245, 158, 11, 0.2);
      color: var(--accent-yellow);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <header class="top-header">
    <div style="font-weight: bold; color: var(--accent-yellow);">LOOT PLAY</div>
    <div class="coin-badge">
      <i class="fa-solid fa-coins"></i>
      <span id="user-points">0</span>
    </div>
  </header>

  <div class="section-title" style="margin-top: 15px;">
    <i class="fa-solid fa-clock-rotate-left"></i>
    <h3>سجل السحوبات والمشتريات</h3>
  </div>

  <main class="history-list" id="purchases-container">
    <div class="history-item">
      <div>
        <h4 style="color: #fff;">بطاقة $5 Google Play</h4>
        <span style="color: #888; font-size: 12px;">2026-09-14</span>
      </div>
      <span class="status-pending">قيد المعالجة</span>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
    <a href="wheel.html" class="nav-link"><i class="fa-solid fa-dharmachakra"></i><span>العجلة</span></a>
    <a href="rewards.html" class="nav-link"><i class="fa-solid fa-gift"></i><span>المكافآت</span></a>
    <a href="referral.html" class="nav-link"><i class="fa-solid fa-users"></i><span>الإحالة</span></a>
    <a href="profile.html" class="nav-link"><i class="fa-solid fa-user"></i><span>حسابي</span></a>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
