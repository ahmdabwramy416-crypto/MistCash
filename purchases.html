<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المشتريات - MistCash</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .purchase-item { background: #0c0a00; padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #eab308; display: flex; justify-content: space-between; align-items: center; }
        .code { color: #eab308; font-weight: bold; background: #2e2800; padding: 6px 12px; border-radius: 6px; border: 1px solid #eab308; }
    </style>
</head>
<body>

    <div class="header container">
        <h2>سجل المشتريات</h2>
    </div>

    <div class="container">
        <div class="card">
            <h3 style="margin-bottom: 15px; text-align: center;">الهدايا والأكواد المستبدلة</h3>
            <div id="purchasesList">
                <p style="text-align: center; color: #cbd5e1;">جاري التحميل...</p>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>الرئيسية</a>
        <a href="referral.html" class="nav-item"><span class="nav-icon">👥</span>الدعوات</a>
        <a href="store.html" class="nav-item"><span class="nav-icon">🎁</span>المتجر</a>
        <a href="purchases.html" class="nav-item active"><span class="nav-icon">📦</span>المشتريات</a>
        <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span>حسابي</a>
    </div>

    <script>
        if (localStorage.getItem("is_logged_in") !== "true") { window.location.href = "login.html"; }
        
        const userEmail = localStorage.getItem("user_email");
        const purchasesKey = "purchases_" + userEmail;
        const purchases = JSON.parse(localStorage.getItem(purchasesKey) || "[]");
        const listContainer = document.getElementById("purchasesList");

        if (purchases.length === 0) {
            listContainer.innerHTML = '<p style="text-align: center; color: #cbd5e1;">ليس لديك أي مشتريات حتى الآن. توجه للمتجر وابدأ الاستبدال!</p>';
        } else {
            listContainer.innerHTML = "";
            purchases.forEach(p => {
                listContainer.innerHTML += `
                    <div class="purchase-item">
                        <div>
                            <strong>${p.item}</strong>
                            <div style="font-size: 0.8rem; color: #cbd5e1; margin-top: 3px;">التاريخ: ${p.date}</div>
                        </div>
                        <div class="code">${p.code}</div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
