<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المشتريات - Gamer Pro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .purchase-card {
            background: #1a1700;
            border: 1px solid #eab308;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .purchase-card h4 { color: #eab308; margin-bottom: 5px; }
        .purchase-card p { color: #cbd5e1; font-size: 0.85rem; margin: 4px 0; }
        .promo-box {
            background: #0f172a;
            border: 1px dashed #4ade80;
            padding: 8px;
            border-radius: 6px;
            margin-top: 8px;
            color: #4ade80;
            font-family: monospace;
            font-weight: bold;
            text-align: center;
        }
        .status-pending { color: #facc15; font-weight: bold; }
        .status-sent { color: #4ade80; font-weight: bold; }

        /* تنسيق مخصص لشريط التنقل ليتسع لـ 6 أزرار بانتظام */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #1a1700; border-top: 2px solid #eab308; display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; box-shadow: 0 -4px 20px rgba(234, 179, 8, 0.15); }
        .nav-item { color: #cbd5e1; text-decoration: none; font-size: 0.65rem; text-align: center; display: flex; flex-direction: column; align-items: center; transition: 0.3s; flex: 1; }
        .nav-item.active, .nav-item:hover { color: #eab308; transform: translateY(-2px); }
        .nav-icon { font-size: 1.1rem; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="header container" style="padding: 15px; text-align: center;">
        <h2>سجل المشتريات والطلبات</h2>
    </div>

    <div class="container" id="purchasesContainer">
        <p style="text-align: center; color: #94a3b8;">جاري تحميل طلباتك...</p>
    </div>

    <!-- شريط التنقل السفلي المحدث (6 أزرار) -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>الرئيسية</a>
        <a href="videos.html" class="nav-item"><span class="nav-icon">🎬</span>فيديوهات</a>
        <a href="rewards.html" class="nav-item"><span class="nav-icon">👥</span>الدعوات</a>
        <a href="store.html" class="nav-item"><span class="nav-icon">🔥</span>المتجر</a>
        <a href="purchases.html" class="nav-item active"><span class="nav-icon">📦</span>المشتريات</a>
        <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span>حسابي</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyB6rnXLMDlvy0Eezc7MkdmP334EzPTKlGE",
          authDomain: "mistcash-9a71c.firebaseapp.com",
          projectId: "mistcash-9a71c",
          storageBucket: "mistcash-9a71c.firebasestorage.app",
          messagingSenderId: "819929785371",
          appId: "1:819929785371:web:396e322f83319016bb44be",
          measurementId: "G-FGBZZ1P9W6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        if (localStorage.getItem("is_logged_in") !== "true") { 
            window.location.href = "login.html"; 
        }

        const userEmail = localStorage.getItem("user_email");
        const container = document.getElementById("purchasesContainer");

        async function loadPurchases() {
            try {
                // جلب الطلبات الخاصة بهذا المستخدم فقط من جدول withdrawals
                const q = query(collection(db, "withdrawals"), where("email", "==", userEmail));
                const querySnapshot = await getDocs(q);

                container.innerHTML = "";

                if (querySnapshot.empty) {
                    container.innerHTML = `<p style="text-align: center; color: #94a3b8; margin-top: 30px;">ليس لديك أي طلبات سابقة في المتجر.</p>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    let data = docSnap.data();
                    let statusClass = data.status.includes("تم") ? "status-sent" : "status-pending";
                    
                    // إذا كان هناك كود شحن مضاف، نقوم بعرضه في صندوق خاص
                    let promoHtml = "";
                    if (data.promoCode && data.promoCode.trim() !== "") {
                        promoHtml = `<div class="promo-box">كود الهدية / الشحن: ${data.promoCode}</div>`;
                    } else {
                        promoHtml = `<div style="font-size: 0.8rem; color: #94a3b8; margin-top: 5px;">سيظهر كود الجائزة هنا فور إرسالها من الإدارة.</div>`;
                    }

                    container.innerHTML += `
                        <div class="purchase-card">
                            <h4>🎁 ${data.reward}</h4>
                            <p>💰 التكلفة: ${data.cost} نقطة</p>
                            <p>📅 التاريخ: ${data.date}</p>
                            <p>الحالة: <span class="${statusClass}">${data.status}</span></p>
                            ${promoHtml}
                        </div>
                    `;
                });

            } catch (err) {
                console.error("Error loading purchases:", err);
                container.innerHTML = `<p style="text-align: center; color: #ef4444;">حدث خطأ أثناء تحميل الطلبات.</p>`;
            }
        }

        loadPurchases();
    </script>
</body>
</html>
