<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفيديوهات - Gamer Pro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .video-card {
            background: #1a1700;
            border: 1px solid #eab308;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }
        .video-card h3 { color: #eab308; margin-bottom: 10px; }
        .video-card p { color: #cbd5e1; font-size: 0.9rem; margin-bottom: 15px; }

        /* تنسيق مخصص لشريط التنقل السفلي بـ 6 أزرار متساوية */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #1a1700; border-top: 2px solid #eab308; display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; box-shadow: 0 -4px 20px rgba(234, 179, 8, 0.15); }
        .nav-item { color: #cbd5e1; text-decoration: none; font-size: 0.65rem; text-align: center; display: flex; flex-direction: column; align-items: center; transition: 0.3s; flex: 1; }
        .nav-item.active, .nav-item:hover { color: #eab308; transform: translateY(-2px); }
        .nav-icon { font-size: 1.1rem; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="header container" style="display: flex; justify-content: space-between; align-items: center; padding: 15px;">
        <h2>قسم الفيديوهات</h2>
        <div class="points-box" style="background: #1a1700; border: 1px solid #eab308; padding: 8px 15px; border-radius: 8px; color: #eab308; font-weight: bold;">
            النقاط: <span id="userPoints" style="color: #fff;">0</span>
        </div>
    </div>

    <div class="container" style="margin-bottom: 80px;">
        <div class="video-card">
            <h3>شاهد الفيديو واربح النقاط</h3>
            <p>اضغط على الزر أدناه لمشاهدة الإعلان أو الفيديو واكسب النقاط فور إتمامه.</p>
            <button onclick="watchVideo()" class="btn-yellow" style="width: 100%; padding: 12px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer;">مشاهدة وفوز (10 نقاط)</button>
            <p id="videoStatus" style="color: #eab308; font-weight: bold; margin-top: 12px;"></p>
        </div>
    </div>

    <!-- شريط التنقل السفلي بـ 6 أزرار مرتبة وصحيحة -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>الرئيسية</a>
        <a href="videos.html" class="nav-item active"><span class="nav-icon">🎬</span>فيديوهات</a>
        <a href="referral.html" class="nav-item"><span class="nav-icon">👥</span>الدعوات</a>
        <a href="store.html" class="nav-item"><span class="nav-icon">🔥</span>المتجر</a>
        <a href="purchases.html" class="nav-item"><span class="nav-icon">📦</span>المشتريات</a>
        <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span>حسابي</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, updateDoc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyB6rnXLMDlvy0Eezc7MkdmP334EzPTKlGE",
          authDomain: "mistcash-9a71c.firebaseapp.com",
          projectId: "mistcash-9a71c",
          storageBucket: "mistcash-9a71c.firebasestorage.app",
          messagingSenderId: "819929785371",
          appId: "1:819929785371:web:396e322f83319016bb44be",
          measurementId: "G-FGBZZ1P9W6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        if (localStorage.getItem("is_logged_in") !== "true") { 
            window.location.href = "login.html"; 
        }

        const userEmail = localStorage.getItem("user_email");
        const pointsKey = "points_" + userEmail;

        function updatePointsDisplay() {
            let currentVal = localStorage.getItem(pointsKey) || "0";
            document.getElementById("userPoints").innerText = currentVal;
        }
        updatePointsDisplay();

        let isWatching = false;
        window.watchVideo = async function() {
            if (isWatching) return;
            isWatching = true;
            
            const statusText = document.getElementById("videoStatus");
            statusText.innerText = "جاري تحميل الفيديو...";

            setTimeout(async () => {
                let currentPoints = parseInt(localStorage.getItem(pointsKey) || "0");
                let earnedPoints = 10;
                currentPoints += earnedPoints;

                localStorage.setItem(pointsKey, currentPoints);
                updatePointsDisplay();

                try {
                    const userRef = doc(db, "users", userEmail);
                    await updateDoc(userRef, { points: currentPoints });
                } catch (err) {
                    console.error("خطأ في تحديث نقاط الفيديو بالسحابة:", err);
                }

                statusText.innerText = `مبروك! تم إضافة ${earnedPoints} نقاط لرصيدك.`;
                isWatching = false;
            }, 3000);
        }
    </script>
</body>
</html>
