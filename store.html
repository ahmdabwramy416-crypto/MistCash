<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الهدايا - MistCash</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header container">
        <h2>متجر المكافآت</h2>
        <div class="points-box">الرصيد: <span id="userPoints">0</span> نقطة</div>
    </div>

    <div class="container">
        <div class="grid">
            <div class="card" style="text-align: center;">
                <h3>60 شدة ببجي موبايل</h3>
                <p style="color: #cbd5e1; margin: 10px 0;">التكلفة: 500 نقطة</p>
                <button onclick="buyItem('60 شدة ببجي موبايل', 500)" class="btn-yellow">استبدال الآن</button>
            </div>
            <div class="card" style="text-align: center;">
                <h3>100 جوهرة فري فاير</h3>
                <p style="color: #cbd5e1; margin: 10px 0;">التكلفة: 400 نقطة</p>
                <button onclick="buyItem('100 جوهرة فري فاير', 400)" class="btn-yellow">استبدال الآن</button>
            </div>
            <div class="card" style="text-align: center;">
                <h3>بطاقة جوجل بلاي 10$</h3>
                <p style="color: #cbd5e1; margin: 10px 0;">التكلفة: 1000 نقطة</p>
                <button onclick="buyItem('بطاقة جوجل بلاي 10$', 1000)" class="btn-yellow">استبدال الآن</button>
            </div>
            <div class="card" style="text-align: center;">
                <h3>بطاقة أمزون 10$</h3>
                <p style="color: #cbd5e1; margin: 10px 0;">التكلفة: 900 نقطة</p>
                <button onclick="buyItem('بطاقة أمزون 10$', 900)" class="btn-yellow">استبدال الآن</button>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>الرئيسية</a>
        <a href="referral.html" class="nav-item"><span class="nav-icon">👥</span>الدعوات</a>
        <a href="store.html" class="nav-item active"><span class="nav-icon">🎁</span>المتجر</a>
        <a href="purchases.html" class="nav-item"><span class="nav-icon">📦</span>المشتريات</a>
        <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span>حسابي</a>
    </div>

    <script>
        if (localStorage.getItem("is_logged_in") !== "true") { window.location.href = "login.html"; }
        
        const userEmail = localStorage.getItem("user_email");
        const pointsKey = "points_" + userEmail;
        const purchasesKey = "purchases_" + userEmail;

        function updatePoints() {
            let currentVal = localStorage.getItem(pointsKey) || "0";
            document.getElementById("userPoints").innerText = currentVal;
        }
        updatePoints();

        function buyItem(itemName, cost) {
            let points = parseInt(localStorage.getItem(pointsKey) || "0");
            if (points < cost) {
                alert("عذراً، رصيدك غير كافي لإتمام عملية الاستبدال!");
                return;
            }
            points -= cost;
            localStorage.setItem(pointsKey, points);
            updatePoints();

            const randomCode = 'MIST-' + Math.random().toString(36).substring(2, 10).toUpperCase();
            let purchases = JSON.parse(localStorage.getItem(purchasesKey) || "[]");
            purchases.push({ item: itemName, code: randomCode, date: new Date().toLocaleDateString() });
            localStorage.setItem(purchasesKey, JSON.stringify(purchases));

            alert(`مبروك! تمت عملية الاستبدال بنجاح.\nكود الهدية الحقيقي: ${randomCode}\nتم حفظ الكود في صفحة المشتريات.`);
        }
    </script>
</body>
</html>
