<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر - Gamer Pro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .store-grid { display: grid; gap: 15px; margin-bottom: 25px; }
        .store-card { background: #1a1700; border: 1px solid #eab308; padding: 15px; border-radius: 12px; text-align: center; }
        .store-card h3 { color: #eab308; margin-bottom: 8px; }
        .store-card p { color: #cbd5e1; font-size: 0.9rem; margin-bottom: 12px; }

        /* تنسيق مخصص لشريط التنقل ليتسع لـ 6 أزرار بانتظام */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #1a1700; border-top: 2px solid #eab308; display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; box-shadow: 0 -4px 20px rgba(234, 179, 8, 0.15); }
        .nav-item { color: #cbd5e1; text-decoration: none; font-size: 0.65rem; text-align: center; display: flex; flex-direction: column; align-items: center; transition: 0.3s; flex: 1; }
        .nav-item.active, .nav-item:hover { color: #eab308; transform: translateY(-2px); }
        .nav-icon { font-size: 1.1rem; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="header container" style="display: flex; justify-content: space-between; align-items: center; padding: 15px;">
        <h2>المتجر</h2>
        <div class="points-box" style="background: #1a1700; border: 1px solid #eab308; padding: 8px 15px; border-radius: 8px; color: #eab308; font-weight: bold;">
            النقاط: <span id="userPoints" style="color: #fff;">0</span>
        </div>
    </div>

    <div class="container">
        <div class="store-grid">
            <!-- عنصر 1: شدات ببجي (1000 نقطة) -->
            <div class="store-card">
                <h3>60 شدة ببجي (UC)</h3>
                <p>السعر: <span style="color: #4ade80; font-weight: bold;">1000 نقطة</span></p>
                <button onclick="requestReward('60 شدة ببجي', 1000)" class="btn-yellow" style="width: 100%; padding: 10px; background: #eab308; border: none; font-weight: bold; border-radius: 8px; cursor: pointer;">استبدال الآن</button>
            </div>

            <!-- عنصر 2: بطاقة جوجل بلاي (1500 نقطة) -->
            <div class="store-card">
                <h3>بطاقة جوجل بلاي 10$</h3>
                <p>السعر: <span style="color: #4ade80; font-weight: bold;">1500 نقطة</span></p>
                <button onclick="requestReward('بطاقة جوجل بلاي 10$', 1500)" class="btn-yellow" style="width: 100%; padding: 10px; background: #eab308; border: none; font-weight: bold; border-radius: 8px; cursor: pointer;">استبدال الآن</button>
            </div>

            <!-- عنصر 3: جواهر فري فاير (800 نقطة) -->
            <div class="store-card">
                <h3>100 جوهرة فري فاير</h3>
                <p>السعر: <span style="color: #4ade80; font-weight: bold;">800 نقطة</span></p>
                <button onclick="requestReward('100 جوهرة فري فاير', 800)" class="btn-yellow" style="width: 100%; padding: 10px; background: #eab308; border: none; font-weight: bold; border-radius: 8px; cursor: pointer;">استبدال الآن</button>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي المحدث والصحيح (6 أزرار) -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>الرئيسية</a>
        <a href="videos.html" class="nav-item"><span class="nav-icon">🎬</span>فيديوهات</a>
        <a href="referral.html" class="nav-item"><span class="nav-icon">👥</span>الدعوات</a>
        <a href="store.html" class="nav-item active"><span class="nav-icon">🔥</span>المتجر</a>
        <a href="purchases.html" class="nav-item"><span class="nav-icon">📦</span>المشتريات</a>
        <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span>حسابي</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyB6rnXLMDlvy0Eezc7MkdmP334EzPTKlGE",
          authDomain: "mistcash-9a71c.firebaseapp.com",
          projectId: "mistcash-9a71c",
          storageBucket: "mistcash-9a71c.firebasestorage.app",
          messagingSenderId: "819929785371",
          appId: "1:819929785371:web:396e322f83319016bb44be",
          measurementId: "G-FGBZZ1P9W6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        if (localStorage.getItem("is_logged_in") !== "true") { window.location.href = "login.html"; }

        const userEmail = localStorage.getItem("user_email");
        const pointsKey = "points_" + userEmail;

        function updatePointsDisplay() {
            let currentVal = localStorage.getItem(pointsKey) || "0";
            document.getElementById("userPoints").innerText = currentVal;
        }
        updatePointsDisplay();

        const TELEGRAM_BOT_TOKEN = "8620401005:AAFpngsB3sNk_2VsMzNfidSVTP9sMDAad8o"; 
        const TELEGRAM_CHAT_ID = "8767568410"; 

        window.requestReward = async function(rewardName, cost) {
            let currentPoints = parseInt(localStorage.getItem(pointsKey) || "0");

            if (currentPoints < cost) {
                alert("عذراً، رصيدك من النقاط غير كافٍ لطلب هذه الجائزة!");
                return;
            }

            if (!confirm(`هل أنت متأكد من رغبتك في استبدال ${cost} نقطة بـ (${rewardName})؟`)) {
                return;
            }

            try {
                await addDoc(collection(db, "withdrawals"), {
                    email: userEmail,
                    reward: rewardName,
                    cost: cost,
                    status: "قيد المعالجة (انتظار الإرسال)",
                    date: new Date().toLocaleString(),
                    promoCode: ""
                });

                const userRef = doc(db, "users", userEmail);
                let newPoints = currentPoints - cost;
                await setDoc(userRef, { points: newPoints }, { merge: true });

                localStorage.setItem(pointsKey, newPoints);
                updatePointsDisplay();

                if (TELEGRAM_BOT_TOKEN && TELEGRAM_CHAT_ID) {
                    const message = `🔔 طلب استبدال جديد!\n\n👤 المستخدم: ${userEmail}\n🎁 الجائزة: ${rewardName}\n💰 التكلفة: ${cost} نقطة`;
                    fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: message
                        })
                    }).catch(err => console.log("Telegram error:", err));
                }

                alert("تم تقديم طلبك بنجاح! سيتم مراجعته وإرساله قريباً.");
                window.location.href = "purchases.html";

            } catch (err) {
                console.error("Firebase Error details:", err);
                alert("حدث خطأ ما: " + err.message);
            }
        }
    </script>
</body>
</html>
