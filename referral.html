<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loot Play - نظام الإحالة</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="top-header">
    <div style="font-weight: bold; color: var(--accent-yellow);">LOOT PLAY</div>
    <div class="coin-badge">
      <i class="fa-solid fa-coins"></i>
      <span id="user-points">0</span>
    </div>
  </header>

  <main style="padding: 20px; max-width: 500px; margin: 0 auto; text-align: center;">
    <i class="fa-solid fa-users-viewfinder" style="font-size: 60px; color: var(--accent-yellow); margin-bottom: 15px;"></i>
    <h2 style="color: #fff; margin-bottom: 10px;">ادعُ أصدقاءك واكسب النقاط! 🎁</h2>
    <p style="color: #aaa; font-size: 14px; margin-bottom: 25px;">احصل على <b>100 نقطة</b> عن كل صديق يسجل في التطبيق عبر رابطك الخاص.</p>

    <div style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px;">
      <label style="color: #888; font-size: 12px; display: block; margin-bottom: 8px;">رابط الدعوة الخاص بك:</label>
      <input type="text" id="ref-link" readonly value="جاري التحميل..." style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: #0c0d12; color: #fff; text-align: center; margin-bottom: 12px; box-sizing: border-box;">
      <button id="copy-ref-btn" style="width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--accent-gold); color: #000; font-weight: bold; cursor: pointer;">
        <i class="fa-solid fa-copy"></i> نسخ الرابط
      </button>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
    <a href="wheel.html" class="nav-link"><i class="fa-solid fa-dharmachakra"></i><span>العجلة</span></a>
    <a href="rewards.html" class="nav-link"><i class="fa-solid fa-gift"></i><span>المكافآت</span></a>
    <a href="referral.html" class="nav-link active"><i class="fa-solid fa-users"></i><span>الإحالة</span></a>
    <a href="profile.html" class="nav-link"><i class="fa-solid fa-user"></i><span>حسابي</span></a>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
