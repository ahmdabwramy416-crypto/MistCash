<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة الأصدقاء - MistCash</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', Tahoma, sans-serif; }
        body { background-color: #0d0519; color: #ffffff; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #1a0b2e; border: 1px solid #3b1568; border-radius: 16px; padding: 30px; width: 100%; max-width: 450px; text-align: center; }
        h2 { color: #eab308; margin-bottom: 15px; }
        p { color: #cbd5e1; font-size: 0.95rem; margin-bottom: 20px; line-height: 1.6; }
        input { width: 100%; padding: 12px; background: #2a1147; border: 1px solid #4c1d95; color: #fff; border-radius: 8px; text-align: center; margin-bottom: 15px; font-size: 0.9rem; }
        .btn { display: block; width: 100%; padding: 12px; background: #7c3aed; color: white; border: none; border-radius: 8px; text-decoration: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #6d28d9; }
    </style>
</head>
<body>
    <div class="card">
        <h2>اربح 50 نقطة لكل صديق</h2>
        <p>قم بمشاركة رابط الإحالة الخاص بك مع أصدقائك، واكسب نقاطاً فورية عندما يسجلون في الموقع!</p>
        
        <input type="text" id="refLink" readonly>
        <button onclick="copyLink()" class="btn" style="background: #eab308; color: #0d0519;">نسخ الرابط</button>
        <a href="index.html" class="btn">العودة للرئيسية</a>
    </div>

    <script>
        if (localStorage.getItem("is_logged_in") !== "true") {
            window.location.href = "login.html";
        }
        
        // توليد رابط إحالة خاص يعتمد على بريد المستخدم
        const userEmail = localStorage.getItem("user_email") || "user";
        const uniqueCode = btoa(userEmail).substring(0, 8);
        const refUrl = `https://ahmdabwramy416-crypto.github.io/MistCash/login.html?ref=${uniqueCode}`;
        document.getElementById("refLink").value = refUrl;

        function copyLink() {
            const copyText = document.getElementById("refLink");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("تم نسخ رابط الدعوة بنجاح!");
        }
    </script>
</body>
</html>
