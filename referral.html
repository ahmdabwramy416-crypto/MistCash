<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loot Play - نظام الإحالة</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="top-header">
    <div style="font-weight: bold; color: var(--accent-yellow);">LOOT PLAY</div>
    <div class="coin-badge">
      <i class="fa-solid fa-coins"></i>
      <span id="user-points">0</span>
    </div>
  </header>

  <main style="padding: 20px; text-align: center;">
    <div class="hero-banner">
      <h2>ادعُ أصدقاءك واكسب 🪙</h2>
      <p style="color: #ccc; font-size: 13px;">احصل على 100 نقطة عن كل صديق يقوم بالتسجيل من خلال رابطك!</p>
    </div>

    <div style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 20px; margin-top: 20px;">
      <h3 style="margin-bottom: 15px; color: var(--accent-yellow);">رابط الدعوة الخاص بك</h3>
      <input type="text" id="ref-link" value="جاري التحميل..." readonly style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: #0c0d12; color: #fff; text-align: center; margin-bottom: 15px;">
      <button onclick="navigator.clipboard.writeText(document.getElementById('ref-link').value); alert('تم نسخ رابط الدعوة!');" style="background: var(--accent-gold); border: none; padding: 12px 25px; font-weight: bold; border-radius: 8px; cursor: pointer;">نسخ الرابط</button>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
    <a href="wheel.html" class="nav-link"><i class="fa-solid fa-dharmachakra"></i><span>العجلة</span></a>
    <a href="rewards.html" class="nav-link"><i class="fa-solid fa-gift"></i><span>المكافآت</span></a>
    <a href="referral.html" class="nav-link active"><i class="fa-solid fa-users"></i><span>الإحالة</span></a>
    <a href="profile.html" class="nav-link"><i class="fa-solid fa-user"></i><span>حسابي</span></a>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
