<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة الأصدقاء - MistCash</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 80vh; }
        input { width: 100%; padding: 12px; background: #0c0a00; border: 1px solid #eab308; color: #fff; border-radius: 8px; text-align: center; margin: 15px 0; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container" style="width: 100%;">
        <div class="card" style="text-align: center;">
            <h2>نظام الإحالات (10% أرباح مدى الحياة)</h2>
            <p style="color: #cbd5e1; margin-top: 10px; font-size: 0.95rem;">شارك رابط الإحالة الخاص بك، واكسب عمولة <strong>10%</strong> من كل نقطة يجمعها أصدقاؤك عندما يسجلون من خلاله:</p>
            <input type="text" id="refLink" readonly>
            <button onclick="copyLink()" class="btn-yellow" style="margin-bottom: 15px;">نسخ رابط الدعوة</button>
            
            <div style="background: #2e2800; padding: 12px; border-radius: 8px; border: 1px solid #eab308; margin-top: 10px;">
                <p style="font-size: 0.9rem; color: #fff;">أرباح الإحالات غير المضافة: <span id="refBonusPoints" style="color: #eab308; font-weight: bold;">0</span> نقطة</p>
                <button onclick="claimRefPoints()" class="btn-yellow" style="margin-top: 10px; padding: 8px; font-size: 0.9rem;">تحويل الأرباح لرصيدي</button>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>الرئيسية</a>
        <a href="referral.html" class="nav-item active"><span class="nav-icon">👥</span>الدعوات</a>
        <a href="store.html" class="nav-item"><span class="nav-icon">🎁</span>المتجر</a>
        <a href="purchases.html" class="nav-item"><span class="nav-icon">📦</span>المشتريات</a>
        <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span>حسابي</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyB6rnXLMDlvy0Eezc7MkdmP334EzPTKlGE",
          authDomain: "mistcash-9a71c.firebaseapp.com",
          projectId: "mistcash-9a71c",
          storageBucket: "mistcash-9a71c.firebasestorage.app",
          messagingSenderId: "819929785371",
          appId: "1:819929785371:web:396e322f83319016bb44be",
          measurementId: "G-FGBZZ1P9W6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        if (localStorage.getItem("is_logged_in") !== "true") { window.location.href = "login.html"; }
        
        const userEmail = localStorage.getItem("user_email");
        const uniqueCode = btoa(userEmail).substring(0, 8);
        
        // توليد رابط الدعوة
        const currentWebsiteUrl = window.location.origin + window.location.pathname.replace("referral.html", "login.html");
        document.getElementById("refLink").value = `${currentWebsiteUrl}?ref=${uniqueCode}`;

        let pendingBonusValue = 0;
        const bonusDocRef = doc(db, "referrals_bonus", uniqueCode);
        const userDocRef = doc(db, "users", userEmail);

        // جلب الأرباح المعلقة من السحابة
        async function fetchBonus() {
            try {
                const docSnap = await getDoc(bonusDocRef);
                if (docSnap.exists()) {
                    pendingBonusValue = docSnap.data().bonus || 0;
                    document.getElementById("refBonusPoints").innerText = pendingBonusValue;
                }
            } catch (err) {
                console.error("Error fetching bonus:", err);
            }
        }
        fetchBonus();

        window.copyLink = function() {
            const copyText = document.getElementById("refLink");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("تم نسخ رابط الدعوة بنجاح! شاركه مع أصدقائك لكسب 10% من أرباحهم.");
        }

        window.claimRefPoints = async function() {
            if (pendingBonusValue <= 0) {
                alert("لا توجد أرباح إحالة جديدة للتحويل حالياً.");
                return;
            }

            try {
                // إضافة الأرباح إلى رصيد المستخدم الأساسي في Firestore
                await updateDoc(userDocRef, {
                    points: increment(pendingBonusValue)
                });

                // تصفير الأرباح المعلقة في السحابة
                await updateDoc(bonusDocRef, {
                    bonus: 0
                });

                // تحديث المتصفح المحلي
                let currentLocalPoints = parseInt(localStorage.getItem("user_points") || "0") + pendingBonusValue;
                localStorage.setItem("user_points", currentLocalPoints);
                localStorage.setItem("points_" + userEmail, currentLocalPoints);

                alert(`تم تحويل ${pendingBonusValue} نقطة بنجاح إلى رصيدك الأساسي!`);
                pendingBonusValue = 0;
                document.getElementById("refBonusPoints").innerText = "0";
            } catch (err) {
                console.error("Error claiming points:", err.message);
                alert("حدث خطأ أثناء تحويل النقاط، يرجى التحقق من اتصال الإنترنت.");
            }
        }
    </script>
</body>
</html>
