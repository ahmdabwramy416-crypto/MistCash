<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة الأصدقاء - MistCash</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 80vh; }
        input { width: 100%; padding: 12px; background: #0c0a00; border: 1px solid #eab308; color: #fff; border-radius: 8px; text-align: center; margin: 15px 0; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container" style="width: 100%;">
        <div class="card" style="text-align: center;">
            <h2>اربح 50 نقطة لكل صديق</h2>
            <p style="color: #cbd5e1; margin-top: 10px; font-size: 0.95rem;">شارك رابط الإحالة الخاص بك، واكسب نقاطاً حقيقية عندما يسجل أصدقاؤك:</p>
            <input type="text" id="refLink" readonly>
            <button onclick="copyLink()" class="btn-yellow">نسخ رابط الدعوة</button>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>الرئيسية</a>
        <a href="referral.html" class="nav-item active"><span class="nav-icon">👥</span>الدعوات</a>
        <a href="store.html" class="nav-item"><span class="nav-icon">🎁</span>المتجر</a>
        <a href="purchases.html" class="nav-item"><span class="nav-icon">📦</span>المشتريات</a>
        <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span>حسابي</a>
    </div>

    <script>
        if (localStorage.getItem("is_logged_in") !== "true") { window.location.href = "login.html"; }
        const userEmail = localStorage.getItem("user_email") || "user";
        const uniqueCode = btoa(userEmail).substring(0, 8);
        document.getElementById("refLink").value = `https://ahmdabwramy416-crypto.github.io/MistCash/login.html?ref=${uniqueCode}`;

        function copyLink() {
            const copyText = document.getElementById("refLink");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("تم نسخ رابط الدعوة بنجاح!");
        }
    </script>
</body>
</html>
