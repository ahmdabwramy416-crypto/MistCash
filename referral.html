<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MistCash | الإحالة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo"><i class="fa-solid fa-gamepad"></i> MistCash</a>
        <nav class="desktop-nav">
            <a href="index.html"><i class="fa-solid fa-coins"></i> كسب النقاط</a>
            <a href="rewards.html"><i class="fa-solid fa-gift"></i> الجوائز</a>
            <a href="referral.html" class="active"><i class="fa-solid fa-users"></i> الاحالة</a>
            <a href="profile.html"><i class="fa-solid fa-user"></i> الحساب</a>
        </nav>
        <div class="user-stats">
            <div class="stat-badge"><i class="fa-solid fa-coins"></i> <span>1,250</span></div>
        </div>
    </header>

    <main>
        <div class="profile-card">
            <div class="section-title"><i class="fa-solid fa-user-plus"></i> برنامج الإحالة والتسويق</div>
            <p style="color: var(--text-muted); margin-bottom: 15px;">
                شارِك رابط الإحالة الخاص بك مع أصدقائك واكسب <strong>10%</strong> من إجمالي النقاط التي يحصلون عليها مدى الحياة!
            </p>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="ref-link" value="https://mistcash.co/register?ref=user123" readonly 
                       style="flex: 1; padding: 12px; background: var(--bg-dark); border: 1px solid var(--border-color); color: #fff; border-radius: 8px;">
                <button class="btn-action" style="width: auto; padding: 0 20px;" onclick="copyLink()">نسخ الرابط</button>
            </div>
        </div>
    </main>

    <nav class="mobile-nav">
        <a href="index.html"><i class="fa-solid fa-coins"></i><span>الكسب</span></a>
        <a href="rewards.html"><i class="fa-solid fa-gift"></i><span>الجوائز</span></a>
        <a href="referral.html" class="active"><i class="fa-solid fa-users"></i><span>الإحالة</span></a>
        <a href="profile.html"><i class="fa-solid fa-user"></i><span>حسابي</span></a>
    </nav>

    <script>
        function copyLink() {
            const input = document.getElementById("ref-link");
            input.select();
            document.execCommand("copy");
            alert("تم نسخ رابط الإحالة بنجاح!");
        }
    </script>
</body>
</html>
